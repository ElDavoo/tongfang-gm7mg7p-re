# The deep gate, on a schedule. Prepared here rather than landed, because
# `.github/workflows/` is template-copied and the pipeline's push token has no
# `workflow` scope, so a branch that adds a file there fails at the end of the
# PR rather than at the start of it. `docs/agent-pipeline.md` says the same
# thing about every other leg of this that a human has to land.
#
# To land it:
#
#   cp docs/ci/agent-gates-deep-schedule.yml .github/workflows/agent-gates-deep.yml
#
# and that is the whole change. Everything it checks is already committed; it
# calls the deep tier's documented entry point and nothing else, and uploads
# the run's log and its per-row results as two artifacts.
#
# Why it is written to pass the `workflows:` job in ci.yml (actionlint and
# zizmor) before it lands: that job audits every file in this directory, so
# getting the action pin and the permissions right now is cheaper than getting
# them reviewed after a human has copied the file.

name: Deep gates

on:
  workflow_dispatch:
  schedule:
    # 04:23, not 04:00. GitHub starts scheduled workflows from a shared pool
    # around the top of the hour and queues the rest, so an off-minute slot is
    # measurably likelier to start on time.
    #
    # GitHub also delays and sometimes drops scheduled runs under load, without
    # telling anyone, which is the reason this must not become a required
    # check: a check that silently does not run is the failure this repository
    # keeps finding in other shapes. It is a report, not a gate on the PR.
    - cron: '23 4 * * *'

# One at a time, and the second waits rather than cancelling the first. A
# cancelled re-encode leaves no result to read, and the whole value of a
# nightly run is the result.
concurrency:
  group: agent-gates-deep
  cancel-in-progress: false

# The deep gate reads the repository and runs an assembler. It needs nothing
# else, so it asks for nothing else.
permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The cheap tier this runs first includes --verify-provenance, which
          # reads committed history.
          fetch-depth: 0

      # For sdas8051. The cheap tier does not need it, which is why the deep
      # script fails rather than skipping when it is missing.
      - name: Set up the toolchain
        uses: ./.github/actions/project-setup

      # Which assembler this run is about to use, and which one the committed
      # report was measured with. The re-encode's outcome columns are a
      # property of the assembler as much as of the listings -- 52 of 2,705
      # rows differ between the committed nix build and the one project-setup
      # installs (docs/findings.md §14h) -- so a nightly log that does not say
      # which one produced its numbers is a log whose numbers cannot be read.
      #
      # The committed string is read from the report rather than written here,
      # so this stays true as ubuntu-latest drifts instead of going stale the
      # first time apt moves. It prints what it observed and asserts no
      # relationship in either direction: a run that agrees with the committed
      # report is information, and a run that does not is information too.
      - name: Name the assembler
        run: |
          set -uo pipefail
          echo "=== sdas8051 this run will use ==="
          sdcc --version || echo "sdcc --version: unavailable"
          if command -v sdas8051 >/dev/null 2>&1; then
            echo "path:   $(command -v sdas8051)"
            echo "real:   $(readlink -f "$(command -v sdas8051)")"
            # The banner, not the exit code: with no arguments sdas8051
            # prints usage and exits 1, so the || is load-bearing.
            sdas8051 2>&1 | head -2 || true
          else
            echo "path:   NOT ON PATH -- the deep tier below will fail on this"
          fi
          echo
          echo "=== the assembler ec/ghidra/reassembly.csv was measured with ==="
          # Parsed, not cut. 73 of the rows carry a comma inside `detail`, so
          # a `cut -d,` on the ninth field lands mid-detail on those and
          # reports a list of mnemonics instead of a version string.
          #
          # `or ""` rather than .get's default: DictReader presents a short
          # row's missing trailing field as None, and sorting a set containing
          # None raises. This step's job is to describe the report, and it has
          # to survive the report being in a state it is meant to be reporting
          # on.
          committed=$(python3 - <<'PY'
          import csv
          try:
              with open("ec/ghidra/reassembly.csv", newline="") as f:
                  cells = {r.get("assembler") or "" for r in csv.DictReader(f)}
          except OSError as exc:
              cells = {"<unreadable: %s>" % exc}
          print(" ".join(sorted(cells)))
          PY
          )
          echo "committed: ${committed:-<none: every row has no assembler cell>}"
          echo
          echo "If those differ, this run is not a re-measurement of the"
          echo "committed report. See docs/findings.md §14h."

      # The same command ci.yml runs, with the deep tier switched on: the cheap
      # tier first, then the sdas8051 re-encode and the advisory cross-decoder
      # comparison. It is one command because agent-gates.sh hands off to
      # agent-gates-deep.sh, and agent-gates-deep.sh re-runs the cheap tier
      # first -- so this is a superset, not a second gate that can disagree
      # with the first.
      #
      # The whole run goes to a file, and the file is the record. The
      # `schedule:` comment above says GitHub delays and sometimes drops
      # scheduled runs without telling anyone: a run that happened leaves an
      # artifact behind and a run that did not leaves none, so the absence is a
      # signal rather than something to be inferred from silence. The log is
      # the cheap tier's too, because its failures matter to the same reader.
      #
      # pipefail before the pipe, not after. `set -o pipefail` has to be in
      # effect when the pipeline runs or the status is tee's, which is zero
      # however the gate ended -- a failing deep tier reading as a passing one,
      # which is the exact failure this file exists to stop. GitHub's default
      # shell for `run:` is `bash -e`, and -e does not set pipefail.
      - name: Deep gates
        run: |
          set -o pipefail
          AGENT_GATES_DEEP=1 .github/scripts/agent-gates.sh 2>&1 \
            | tee "$RUNNER_TEMP/deep-gates.log"

      # The same re-encode a second time, this one keeping every row instead of
      # printing twenty of them. The step above passes no `--emit-csv`, and the
      # scratch directory it hands `--work` is removed by a `trap ... EXIT`, so
      # the per-row content of a night exists only as a number and a capped list
      # in the log. That is the case `--emit-csv` was built for: the committed
      # report's own row-for-row comparison,
      # `evidence/ec-reencode/2026-09-23-sdas8051-rowdiff.csv`, exists only
      # because a human ran it by hand (docs/findings.md §14h).
      #
      # Placed here rather than folded into the step above, and that is a
      # `.github/` edit this file exists to avoid: `agent-gates-deep.sh` reads no
      # arguments at all, so an `--emit-csv` passed through the existing switch
      # would be silently dropped rather than refused. Twice is the ~4 s §14e
      # measured for the re-encode alone, and the two runs are sequential, so
      # the shared /tmp/ec-verify-images scratch is rebuilt by the second rather
      # than written by both at once.
      #
      # if: always(), for the reason the upload below carries: the night a
      # reader wants is the one that failed.
      - name: Emit the per-row CSV
        if: always()
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/deep-gates.log"
          {
            echo
            echo "=== per-row CSV (--emit-csv) ==="
          } >> "$log"
          # Guarded, not skipped: `if: always()` above is what puts this step
          # on a run whose deep tier failed for want of the assembler, and a
          # second red there would be a second sentence about a fact the log
          # already carries.
          if ! command -v sdas8051 >/dev/null 2>&1; then
            {
              echo "not emitted: sdas8051 is not on PATH, which is the reason"
              echo "the step above failed. The log above is this night's record."
            } >> "$log"
            exit 0
          fi
          # `SDAS8051=''` empty on purpose. find_assembler() prefers it over
          # PATH and an empty value is the same instruction as an unset one
          # there, which is what
          # `evidence/ec-reencode/2026-09-23-sdas8051-versions.md` measured:
          # the reading exercises the PATH entry project-setup installed, so
          # the `assembler` column names the same binary the "Name the
          # assembler" step above printed beside this one. The `''` is the
          # explicit spelling of an empty assignment; the bare `= ` reads as a
          # typo to a linter and warns.
          #
          # No `--limit`, and that is a requirement rather than an omission: a
          # sampled CSV cannot be joined row-for-row against the committed
          # report, and a CSV that silently covers half the firmware is the
          # defect this artifact exists to remove. The exit status is this
          # step's, so a re-encode that finds something fails the run here too
          # rather than uploading a CSV that disagrees with the log.
          #
          # The two `$RUNNER_TEMP` paths are spelled out rather than held in a
          # variable, so a reader of this file -- and `check_deep_schedule_emit`,
          # which holds the destination and the upload beside it -- sees which
          # file each one is without resolving a shell assignment first.
          rc=0
          SDAS8051='' python3 ec/tools/verify_reassembly.py \
            --work "$RUNNER_TEMP/reasm-csv" --jobs 4 \
            --emit-csv "$RUNNER_TEMP/deep-gates-csv.csv" || rc=$?
          {
            if [ -f "$RUNNER_TEMP/deep-gates-csv.csv" ]; then
              echo "wrote $RUNNER_TEMP/deep-gates-csv.csv" \
                   "($(( $(wc -l < "$RUNNER_TEMP/deep-gates-csv.csv") - 1 ))" \
                   "rows)"
            else
              echo "not written: verify_reassembly.py exited $rc"
            fi
            echo
            echo "Uploaded beside this log as deep-gates-csv-${GITHUB_RUN_ID},"
            echo "so a reader pairs the two by run id. Compare it against the"
            echo "committed report on (program, addr) with:"
            echo "  python3 tools/check_deep_schedule_emit.py --diff <csv> \\"
            echo "      ec/ghidra/reassembly.csv"
            echo
            echo "Expect it to differ, and expect the count to be more than the"
            echo "assembler alone accounts for. Two things move a row here, and"
            echo "the tool names which column moved so they can be told apart:"
            echo "  * this run's assembler is the apt SDCC 4.2.0 build and the"
            echo "    committed report was measured with the pinned nix one,"
            echo "    which docs/findings.md §14h measured at 52 rows, all of"
            echo "    them assembler-gap on the committed side;"
            echo "  * a row already in the report keeps the name the function"
            echo "    had when the row was written, so a function renamed since"
            echo "    moves on the name column alone. listing_digest does not"
            echo "    move on those rows: the code did not change, the label did."
            echo "A moved row settles nothing on its own. A result that actually"
            echo "changed is a re-report and a docs/findings/ write-up, not an"
            echo "artifact, and this one is retained for 90 days like the log"
            echo "beside it. Do not re-report from here: this run's assembler is"
            echo "not the one the committed report was measured with, and"
            echo "--report would replace it wholesale rather than refresh it."
          } >> "$log"
          exit "$rc"

      - name: Upload the deep gates log
        # if: always(), because the log anyone wants is the one from the run
        # that failed. A run that fails with no artifact is the same silence
        # this file is here to remove.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The run id, so a reader can tell this night's artifact from last
          # night's without cross-referencing the run list.
          name: deep-gates-${{ github.run_id }}
          path: ${{ runner.temp }}/deep-gates.log
          if-no-files-found: warn
          # 90 is GitHub's default, and saying so explicitly is the point: a
          # value above a stricter repository or organisation cap fails the
          # upload step rather than being clamped. The log is a point-in-time
          # reading of one night; the durable record of a result that *changed*
          # is a re-report and a docs/findings.md entry, not an artifact.
          retention-days: 90

      - name: Upload the deep gates CSV
        # The same pin, the same `always()`, the same `warn` and the same 90
        # days as the log above, and the same reason for each: this is the
        # night's second artifact, and a night that failed is the night a reader
        # wants. `warn` rather than `error` because the step above is the one
        # that could have declined to write it, and a missing CSV should say so
        # here rather than replace the log with an error about a file.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # A different name from the log's, both carrying the run id. Equal
          # names would make upload-artifact v4+ *merge* the two files into one
          # artifact, and "two artifacts" would then be quietly false -- which
          # is what `tools/check_deep_schedule_emit.py` holds.
          name: deep-gates-csv-${{ github.run_id }}
          # The on-disk name carries no run id, exactly as `deep-gates.log`
          # does. The pairing a reader wants is on the artifact *name*, and
          # mirroring the log keeps the two files symmetrical and keeps `${{ }}`
          # out of the `run:` block entirely, which is where a workflow's
          # template-injection surface is.
          #
          # ${{ runner.temp }}-rooted, and that is the `refuses_committed_report`
          # invariant held by construction rather than by a comment: a path
          # under the repository could be `ec/ghidra/reassembly.csv`, which
          # `--emit-csv` refuses and which nothing else should be writing to.
          path: ${{ runner.temp }}/deep-gates-csv.csv
          if-no-files-found: warn
          # A point-in-time reading of one night, like the log. A result that
          # *changed* is a re-report and a write-up under `docs/findings/`, not
          # something an artifact holds for a quarter.
          retention-days: 90
