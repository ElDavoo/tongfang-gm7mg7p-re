name: Project setup
description: >
  Toolchain for TongFang GM7MG7P RE work: Python + PyYAML for the register
  cross-reference and its validation, pefile + dnfile for the .NET/PE tools
  under windows/tools/, radare2 for EC firmware disassembly, sdcc
  (sdas8051/sdld) for the 8051 assemble/link round-trip referenced in
  ec/README.md, the sdcc ucsim simulators (s51) for executing EC code (issue
  #85), innoextract for the Windows installer pipeline in
  windows/tools/extract.sh, Ghidra (headless, with a JDK 21) for decompiling
  the EC firmware towards a C codebase (issue #20, ec/ghidra/README.md),
  ilspycmd (on .NET 8) for the vendor's .NET assemblies, and LongSoft's
  UEFIExtract + ifrextractor for the BIOS image and its setup IFR (issue
  #86). shellcheck, curl and unzip ship preinstalled on the ubuntu-latest
  image, so they aren't installed here.

  After this action: `analyzeHeadless` and `ilspycmd` are on PATH,
  GHIDRA_INSTALL_DIR points at the Ghidra install, and `UEFIExtract` and
  `ifrextractor` are on PATH.

runs:
  using: composite
  steps:
    # No cache: key: -- setup-python's `cache: pip` needs a requirements.txt
    # or pyproject.toml to hash for the cache key, and this repo, not being
    # a Python package, has neither. Asking for it anyway isn't a warning,
    # it's a hard failure of this step before pip ever runs (confirmed by
    # running this in CI: "No file ... matched to [**/requirements.txt or
    # **/pyproject.toml]"). A few packages install in seconds uncached,
    # which is not worth carrying a lockfile-shaped file whose only job
    # would be satisfying this cache key.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Python dependencies
      shell: bash
      # pefile/dnfile: windows/tools/dotnet_bodies.py (method-body census) and
      # the PE parsing in dotnet_dump.py. The tools that talk to hardware or to
      # a running process (ecrw.py, dotnet_dump.py's process reader,
      # uefi_var.py) cannot *run* here -- they need the physical machine -- but
      # anything that only parses committed files can.
      run: pip install --disable-pip-version-check pyyaml pefile dnfile

    - name: apt packages
      shell: bash
      # radare2 in the 24.04 (noble) archive is recent enough for -a 8051;
      # sdcc ships sdas8051/sdld/sdld as one package on Debian/Ubuntu, and
      # sdcc-ucsim carries the ucsim simulators (s51 for the 8051).
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends radare2 sdcc sdcc-ucsim innoextract

    # --- Ghidra -------------------------------------------------------------
    # The long-term EC goal is a C codebase mirroring the firmware (see
    # docs/MISSION.md and ec/ghidra/README.md); Ghidra's 8051 decompiler is
    # the starting point for it. Ghidra 12.x needs a JDK 21. The ~570 MB
    # release zip is pinned by version and SHA-256 and the unpacked install is
    # cached, so only the first run on a new version pays for the download.
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'

    - name: Ghidra cache
      id: ghidra-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/tools/ghidra
        key: ghidra-12.1.3_PUBLIC_20260817

    - name: Ghidra
      shell: bash
      env:
        GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
        GHIDRA_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54
        CACHE_HIT: ${{ steps.ghidra-cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        if [ "$CACHE_HIT" != "true" ] || [ ! -x "$HOME/tools/ghidra/support/analyzeHeadless" ]; then
          curl -fsSL --retry 3 -o /tmp/ghidra.zip "$GHIDRA_URL"
          echo "$GHIDRA_SHA256  /tmp/ghidra.zip" | sha256sum -c -
          rm -rf "$HOME/tools/ghidra" /tmp/ghidra-unpack
          mkdir -p "$HOME/tools" /tmp/ghidra-unpack
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra-unpack
          # The zip holds one top-level ghidra_<version>_PUBLIC directory.
          mv /tmp/ghidra-unpack/ghidra_* "$HOME/tools/ghidra"
          rm -rf /tmp/ghidra.zip /tmp/ghidra-unpack
        fi
        echo "GHIDRA_INSTALL_DIR=$HOME/tools/ghidra" >> "$GITHUB_ENV"
        echo "$HOME/tools/ghidra/support" >> "$GITHUB_PATH"

    # --- .NET decompiler ----------------------------------------------------
    # windows/decompiled/ is ilspycmd output. ilspycmd 10+/11+ needs a newer
    # runtime; 9.1.0.7988 is the last line that installs on .NET 8, and is
    # the version windows/decompiled/v3.1.39.0/ was produced with.
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.x'

    - name: ilspycmd
      shell: bash
      run: |
        set -euo pipefail
        dotnet tool install -g ilspycmd --version 9.1.0.7988
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    # --- UEFI firmware tools ------------------------------------------------
    # UEFIExtract unpacks vendor/bios-*/ images; ifrextractor turns the Setup
    # module's IFR into a readable form-set (issue #86, hidden setup menus).
    - name: UEFIExtract + ifrextractor
      shell: bash
      env:
        UEFIEXTRACT_URL: https://github.com/LongSoft/UEFITool/releases/download/A75/UEFIExtract_NE_A75_x64_linux.zip
        UEFIEXTRACT_SHA256: 5ee05d0da0c235626de67959d6cd97767e0d7ac67d42c8839e5972e8c23fd5a5
        IFREXTRACTOR_URL: https://github.com/LongSoft/IFRExtractor-RS/releases/download/v1.6.1/ifrextractor_1.6.1_linux.zip
        IFREXTRACTOR_SHA256: 5a18e253e560270387657d0165f317d7319cf6296cd5e58b1f13074557514c57
      run: |
        set -euo pipefail
        mkdir -p "$HOME/tools/bin"
        curl -fsSL --retry 3 -o /tmp/uefiextract.zip "$UEFIEXTRACT_URL"
        echo "$UEFIEXTRACT_SHA256  /tmp/uefiextract.zip" | sha256sum -c -
        curl -fsSL --retry 3 -o /tmp/ifrextractor.zip "$IFREXTRACTOR_URL"
        echo "$IFREXTRACTOR_SHA256  /tmp/ifrextractor.zip" | sha256sum -c -
        unzip -o -q /tmp/uefiextract.zip -d "$HOME/tools/bin"
        unzip -o -q /tmp/ifrextractor.zip -d "$HOME/tools/bin"
        chmod +x "$HOME/tools/bin/"*
        rm -f /tmp/uefiextract.zip /tmp/ifrextractor.zip
        echo "$HOME/tools/bin" >> "$GITHUB_PATH"

    - name: Toolchain report
      shell: bash
      # Prints what the rest of the job actually has, so a missing tool shows
      # up here and not as a confusing failure three steps into an agent run.
      run: |
        set -uo pipefail
        python --version
        python -c "import yaml, pefile, dnfile; print('pyyaml/pefile/dnfile ok')"
        r2 -v | head -1
        sdcc --version | head -1
        command -v s51 || echo "s51 not found"
        innoextract --version | head -1
        java -version 2>&1 | head -1
        ls "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"
        ilspycmd --version | head -1
        ls -1 "$HOME/tools/bin"
