name: Agent · conflicts

# LOCAL STAGE (2026-09-24, not in the agent-pipeline template). With several agents running in
# parallel (see the concurrency note at the top of agent-plan.yml), a merge to main routinely
# leaves other open agent pull requests conflicting -- and a conflicting PR never gets CI, a
# review or its auto-merge, so it just sits. This stage finds them and has Claude resolve them.
#
# The branch is rebuilt LINEAR on purpose, not with a merge commit: agent-fix.yml ends every
# round with `git rebase origin/main`, which drops merge commits and would replay the branch's
# commits into the very conflicts resolved here. So the branch's net change is squash-merged
# onto current main, Claude resolves that one conflicted tree, and the result is force-pushed as
# a single commit on top of main. The push re-triggers CI and the review, and the PR's armed
# auto-merge does the rest. (Side effect: the branch's commit count restarts at 1. The fix
# stage's round counter used to be that count, so every resolution handed the pull request a
# fresh ten rounds; since 2026-10-01 it also counts the bot's change-request reviews, which a
# squash cannot reset. See "Count the round" in agent-fix.yml.)
#
# Bounded: at most three attempts per PR head commit, recorded as markers on the PR. After that
# the PR is labelled agent:stuck and left for a human.

#
# Dispatched by agent-retry.yml, one PR per run (`pr` input), which is what makes a resolution
# count as one of MAX_PARALLEL_AGENTS there. It used to run on every push to main and hourly and
# size its own batch from the free slots; a five-PR batch then counted as one busy run, and it
# raced the retry sweep for the same slots. Dispatched by hand without `pr`, it still sweeps every
# conflicting agent PR up to the free slots.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request to resolve (empty: every conflicting agent PR, up to the free slots)'
        required: false
        default: ''

run-name: "${{ inputs.pr && format('Resolve conflicts on PR #{0}', inputs.pr) || 'Agent · conflicts' }}"

permissions: {}

# One run per PR; the resolution below also takes the issue's own pipeline group.
concurrency:
  group: agent-conflicts-${{ inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read
      actions: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
      any: ${{ steps.find.outputs.any }}
    steps:
      - name: Find conflicting agent pull requests
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Keep equal to MAX_PARALLEL_AGENTS in agent-retry.yml.
          # LOCAL CHANGE (2026-10-02): 5 -> 16. It had been left at 5 when agent-retry.yml went
          # to 8 on 2026-09-26, so a hand-dispatched sweep saw too few free slots.
          MAX_PARALLEL_AGENTS: '16'
          MAX_ATTEMPTS: '3'
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then
            # The retry sweep already counted this run as the PR's slot.
            candidates=$PR
            free=1
          else
          # shellcheck disable=SC2016  # $w is a jq variable and has to reach jq unexpanded.
          busy=$(gh run list --limit 200 --json workflowName,status --jq '
            [ .[] | select(.status != "completed")
                  | select(.workflowName as $w
                           | ["Agent · plan","Agent · implement","Agent · review",
                              "Agent · fix CI","Agent · followups","Claude · mention","Agent · conflicts"]
                           | index($w)) ] | length')
          # This run is in that list too, and holds no agent slot while it looks.
          busy=$(( busy - 1 ))
          free=$(( MAX_PARALLEL_AGENTS - busy ))
          echo "$busy agent run(s) in flight, $free slot(s) free"
          candidates=$(gh pr list --state open --limit 100 --json number,headRefName,isDraft,labels --jq '
            [ .[] | select(.headRefName | startswith("agent/issue-"))
                  | select(.isDraft | not)
                  | select([.labels[].name] | any(IN("agent:stop","agent:stuck","no-agent")) | not)
                  | .number ] | sort | .[]')
          fi

          found='[]'
          if [ "$free" -gt 0 ]; then
            for pr in $candidates; do
              [ "$(jq length <<<"$found")" -lt "$free" ] || break
              # GitHub computes mergeability lazily: the first read after main moves is UNKNOWN.
              state=UNKNOWN
              for _ in 1 2 3 4 5 6; do
                state=$(gh pr view "$pr" --json mergeable --jq .mergeable)
                [ "$state" != UNKNOWN ] && break
                sleep 10
              done
              echo "PR #$pr: $state"
              [ "$state" = CONFLICTING ] || continue
              read -r branch head < <(gh pr view "$pr" --json headRefName,headRefOid --jq '"\(.headRefName) \(.headRefOid)"')
              tries=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
                | jq --arg m "<!-- agent-conflicts-attempt sha=${head} -->" \
                     '[.[] | .[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot")
                                | .body | select(contains($m))] | length')
              if [ "$tries" -ge "$MAX_ATTEMPTS" ]; then
                echo "PR #$pr: $tries attempts on ${head:0:7} already -- leaving for the stuck step"
                found=$(jq -c --arg pr "$pr" --arg b "$branch" --arg h "$head" \
                  '. + [{pr: $pr, issue: ($b | ltrimstr("agent/issue-")), head: $h, giveup: true}]' <<<"$found")
                continue
              fi
              found=$(jq -c --arg pr "$pr" --arg b "$branch" --arg h "$head" \
                '. + [{pr: $pr, issue: ($b | ltrimstr("agent/issue-")), head: $h, giveup: false}]' <<<"$found")
            done
          fi
          echo "prs=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = '[]' ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "to resolve: $found"

  resolve:
    needs: [find]
    if: needs.find.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        item: ${{ fromJSON(needs.find.outputs.prs) }}
    # The same group every other stage takes for this issue, so this never races a fix or review.
    concurrency:
      group: agent-pipeline/agent/issue-${{ matrix.item.issue }}
      cancel-in-progress: false
    steps:
      - name: Give up after repeated attempts
        if: matrix.item.giveup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # nothing is checked out on this path, so gh cannot infer the repo;
          # without this the label is never added and the retry sweep loops.
          GH_REPO: ${{ github.repository }}
          PR: ${{ matrix.item.pr }}
        run: |
          gh pr comment "$PR" --body "Conflict resolution against main has been attempted three times on this head commit without producing a mergeable branch, so it is handed to a human. Resolve the conflict by hand, or remove the \`agent:stuck\` label to let the pipeline try again."
          gh pr edit "$PR" --add-label 'agent:stuck'

      - name: Checkout main
        if: ${{ !matrix.item.giveup }}
        # the PAT below is what pushes this branch, so it has to persist.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7  # zizmor: ignore[artipacked]
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Record the attempt, and squash the branch onto main
        if: ${{ !matrix.item.giveup }}
        id: prep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ matrix.item.pr }}
          ISSUE: ${{ matrix.item.issue }}
          HEAD_SHA: ${{ matrix.item.head }}
        run: |
          set -euo pipefail
          gh pr comment "$PR" --body "Resolving the merge conflict with main. <!-- agent-conflicts-attempt sha=${HEAD_SHA} -->"
          git config user.name  'agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin "agent/issue-${ISSUE}"
          # The branch moved since the sweep looked: let the next sweep see the new head.
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::branch moved since the sweep; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git checkout -B "agent/issue-${ISSUE}" origin/main
          git merge --squash "origin/agent/issue-${ISSUE}" > /tmp/merge.txt 2>&1 || true
          cat /tmp/merge.txt
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          echo "conflicted files: $(wc -l < /tmp/conflicts.txt)"
          cat /tmp/conflicts.txt
          # Context for the agent: what each side did, from the merge base.
          base=$(git merge-base origin/main "origin/agent/issue-${ISSUE}")
          git log --oneline "$base..origin/main" > /tmp/main-since-base.txt
          git diff --stat "$base" "origin/agent/issue-${ISSUE}" > /tmp/branch-diffstat.txt
          gh pr view "$PR" --json title,body --jq '"# " + .title + "\n\n" + .body' > /tmp/pr.md
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up the toolchain
        if: ${{ !matrix.item.giveup && steps.prep.outputs.skip == 'false' }}
        uses: ./.github/actions/project-setup

      # LOCAL CHANGE (2026-10-04): a conflict only in generated files needs no agent. The
      # census CSVs, the symbol table and the counterpart map are functions of committed
      # inputs, so regenerating them from the merged inputs is the resolution, and the script
      # exits 1 without touching anything if any conflicted file is hand-written. An agent run
      # here costs up to an hour of a runner; this costs a minute.
      - name: Settle a generated-only conflict mechanically
        id: regen
        if: ${{ !matrix.item.giveup && steps.prep.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          if .github/scripts/regenerate-conflicted.sh; then
            echo "every conflicted file was generated; regenerated without an agent"
            echo "mechanical=true" >> "$GITHUB_OUTPUT"
          else
            echo "mechanical=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve
        id: resolve
        if: ${{ !matrix.item.giveup && steps.prep.outputs.skip == 'false' && steps.regen.outputs.mechanical != 'true' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Pull request #${{ matrix.item.pr }} (issue #${{ matrix.item.issue }}) conflicts with
            main. The working tree is current main with the branch's whole change squash-merged
            on top of it; the conflicted files are listed in /tmp/conflicts.txt and carry
            conflict markers. /tmp/pr.md is the PR description, /tmp/main-since-base.txt the
            commits main gained since the branch forked, /tmp/branch-diffstat.txt what the
            branch changes. Your job is to produce the tree that contains BOTH sides' work.

            Read CLAUDE.md first. Then, for each conflicted file:

            - Hand-written prose and code (docs/findings.md, READMEs, tools): keep both sides'
              additions. Where both edited the same sentence, write one that is true of the
              merged tree. Never drop a finding or a correction; if two sections got the same
              number (e.g. two new "§14g"s), renumber the branch's one and update the
              references that branch added to it.
            - ec/annotations/registers.yaml: entries are list items. Keep every entry from both
              sides; where one side only added entries, the merge is additive. Do not change a
              `status:` value that neither side changed.
            - GENERATED files -- never hand-merge these: ec/decompiled/**,
              ec/ghidra/xdata-symbols.csv, ec/ghidra/manifest.csv, ec/decompiled/index.csv and
              listing-index.csv, ec/annotations/xdata-registers.csv and xdata-clusters.csv,
              ec/ghidra/c-asm-counterpart.csv. Resolve the
              hand-written files first and `git add` them; then
                .github/scripts/regenerate-conflicted.sh
              regenerates and stages every remaining conflicted generated file, in dependency
              order, and names any conflicted file it does not know how to regenerate. If the
              branch added ghidra-functions.csv rows or main changed registers.yaml names,
              re-export the decompile too:
                python3 ec/tools/build_ec_decompile.py --work /tmp/ecb
              (Ghidra is installed; the default build mode re-exports from the committed
              project and does not write it. Never use --mode rebuild-project here.)
            - The XDATA census and the function index are not pinned any more: a self-test
              asserts relations, never a figure. If both sides edited the same assertion,
              keep the relation; never write a measured count back in.
            - A conflict on a total or count of the repository's own text (how many write-ups,
              suites, tests, pins, rows, lines or files), in prose or in a test: delete the
              total rather than recomputing it, on both sides. CLAUDE.md, "No totals of the
              repository's own text".
            - A document that transcribes a tool's output: re-run the tool on the merged tree
              and transcribe that, rather than picking either side's transcript.

            When no conflict markers remain (`git grep -nE '^(<<<<<<<|>>>>>>>) '` returns
            nothing), run:

                .github/scripts/agent-gates.sh

            and the suites that name a file you resolved:

                for f in $(cat /tmp/conflicts.txt); do git grep -l "$(basename "$f")" -- '*/test_*.py' 'test_*.py'; done | sort -u

            Fix what the merge broke in those. Do not run the whole of tools/run-tests.sh: it
            takes hours, CI runs it on the push, and the fix-CI stage takes what is still red.
            Your job is a tree with both sides' work in it, not a green full suite. Do not
            weaken a gate to pass it. If the two sides
            genuinely contradict each other and you cannot write something true of both, stop,
            leave the tree as is, and explain in your final message.

            Do not commit or push. Leave your work in the working tree.
          claude_args: >-
            --model opus
            --effort medium
            --dangerously-skip-permissions
            --max-turns 400
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"
            --disallowedTools "Bash(gh:*),Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(git push:*),Bash(git remote:*),Bash(git config:*),WebFetch,WebSearch"

      - name: Check and push
        if: ${{ !matrix.item.giveup && steps.prep.outputs.skip == 'false' && (steps.resolve.outcome == 'success' || steps.regen.outputs.mechanical == 'true') }}
        env:
          ISSUE: ${{ matrix.item.issue }}
          HEAD_SHA: ${{ matrix.item.head }}
          PR: ${{ matrix.item.pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git add -A
          if [ -s /tmp/conflicts.txt ] && xargs -r -a /tmp/conflicts.txt git grep --cached -lE '^(<<<<<<<|>>>>>>>) ' -- | grep -q .; then
            echo "::error::conflict markers remain; not pushing"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "::error::the resolution is empty -- the branch's change would vanish; not pushing"; exit 1
          fi
          # The PR's own title as the subject: a one-commit PR's squash merge takes its title from
          # this commit, and "PR #N rebuilt ..." is what landed on main for #268, #290 and #303.
          title=$(gh pr view "$PR" --json title --jq .title)
          git commit -q -m "$title" -m "Rebuilt on main by agent-conflicts.yml with the merge conflict resolved."
          # Lease on the head the sweep saw, so a fix push that landed meanwhile is not overwritten.
          git push --force-with-lease="agent/issue-${ISSUE}:${HEAD_SHA}" origin "HEAD:agent/issue-${ISSUE}"

      - name: Report a failed attempt
        if: ${{ !matrix.item.giveup && steps.prep.outputs.skip == 'false' && ((steps.resolve.outcome != 'success' && steps.regen.outputs.mechanical != 'true') || failure()) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ matrix.item.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "The conflict-resolution attempt did not produce a pushable branch ($RUN_URL). The next push to main or the hourly sweep will try again, up to three attempts on this head commit."
