name: Agent · review

# The review leg of the loop, and the merge gate. Runs on every push to an agent branch, in
# parallel with CI rather than after it: the two are independent judgements, and
# serialising them would add a full CI round-trip to every review cycle. Auto-merge waits for
# both regardless, so parallel costs nothing in correctness.
#
# The approving review is submitted with GITHUB_TOKEN, so it lands as github-actions[bot] --
# a different identity from the pull request's author, which is what keeps GitHub's
# self-approval block from firing. It requires Settings -> Actions -> "Allow GitHub Actions to
# create and approve pull requests"; see README.md.
#
# LOCAL CHANGE (2026-09-24, not in the agent-pipeline template): one review per run, not two.
# The template also ran the code-review plugin as an inline pass, which posted as claude[bot]: a
# body-less review per remark next to this stage's github-actions[bot] verdict, whose summary was
# one unformatted paragraph. The verdict now returns its findings as structured data (file, line,
# problem, fix; blocking or not; what it checked itself), and "Unpack the verdict" renders them as
# the markdown review body -- which is also the whole payload the fix stage gets, the job the
# inline comments used to do. `claude.yml` still answers an explicit @claude mention.
#
# LOCAL CHANGE (2026-09-24, not in the agent-pipeline template): a third verdict, `rejected`.
# Approve and request-changes were the only two, so a pull request whose approach was wrong
# could only be fixed forward -- up to ten rounds, holding one of the open-PR slots the whole
# time, and ending as a draft rather than a decision. A rejected pull request is closed with its
# branch deleted, the issue body gets the review and the rejected plan on top so the next plan
# reads why, and the issue goes back to `agent:queued` for the retry sweep to plan again. A
# second rejection of the same issue hands it to a human (`agent:stuck`) instead.
#
# LOCAL CHANGE (2026-09-24): approval appends `Refs #N`, not `Closes #N`, when the issue is
# labelled `needs-hardware-test`. Such a pull request is the preparation; the issue is the live
# run, and closing it on merge is how #184 and #283 were closed with their runs never done.
#
# There is no human downstream of this stage. The prompt says so, deliberately: a reviewer that
# believes someone will catch its misses drifts one way, and one that believes it is the last
# gate drifts the other, and the second drift is the one this pipeline can afford.

on:
  pull_request:
    # `reopened` is here so a review can be re-triggered by closing and reopening the pull
    # request. Re-running the workflow run itself is not equivalent: a re-run replays the
    # workflow file as it was, so it cannot pick up a fix to this file.
    types: [opened, synchronize, reopened]

# Granted per job rather than here: a workflow-level block hands the same token to the gate
# as to the stage that runs the agent, and the gate exists precisely to decide whether the
# agent should run at all.
permissions: {}

# The pipeline-wide serial group; agent-plan.yml carries the reasoning. cancel-in-progress had to
# go from true to false along with it, and not only because a shared group must never cancel
# across stages -- with it still set, a push to any agent branch would cancel whatever implement
# or fix run happened to hold the group. What it used to buy is bought by the queue instead: a
# group holds one pending run, so a burst of pushes to the same branch displaces the older
# waiting reviews and leaves the newest, which is the one worth running anyway.
concurrency:
  group: agent-pipeline/${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    if: >-
      startsWith(github.head_ref, 'agent/issue-')
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'agent:stop')
      && !contains(github.event.pull_request.labels.*.name, 'agent:stuck')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      approved: ${{ steps.unpack.outputs.approved }}
      rejected: ${{ steps.unpack.outputs.rejected }}
      findings: ${{ steps.findings.outputs.text }}
      issue: ${{ steps.ctx.outputs.issue }}
      author: ${{ steps.ctx.outputs.author }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Identify the issue behind the branch
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          issue=${BRANCH#agent/issue-}
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "author=$(gh issue view "$issue" --json author --jq .author.login)" >> "$GITHUB_OUTPUT"

      # The verdict, as data: a merge gate must be a value the workflow can branch on rather than
      # prose someone has to parse. Its findings are data too, and rendered to markdown below,
      # so the review reads the same whatever the model's prose habits.
      - name: Verdict
        id: verdict
        # See agent-plan.yml. A stalled verdict is the quietest failure in the pipeline: CI goes
        # green, auto-merge stays armed, and nothing ever approves — so the pull request sits
        # looking finished. The `fix` job below is skipped automatically once this job fails.
        continue-on-error: true
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          # Keep plugin/subagent aliases on the same provider and model.
          ANTHROPIC_DEFAULT_OPUS_MODEL: stealth/space-bunny-alpha
          ANTHROPIC_DEFAULT_SONNET_MODEL: stealth/space-bunny-alpha
          ANTHROPIC_DEFAULT_HAIKU_MODEL: stealth/space-bunny-alpha
          CLAUDE_CODE_SUBAGENT_MODEL: stealth/space-bunny-alpha
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: 950000
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            You are the merge gate for pull request #${{ github.event.pull_request.number }},
            which implements issue #${{ steps.ctx.outputs.issue }}. It was written by an agent.
            The branch is checked out; `git diff origin/main...HEAD` is the change.

            There is no human reviewer after you. If you approve, this merges to main once CI is
            green. Read CLAUDE.md — it documents the invariants that lint and the tests will not
            catch a change breaking, and it is the standard you are holding this to.

            Block on, and only on:
            - an overclaim -- the rule CLAUDE.md puts above every other. That means: a zero-hit
              static scan written up as "absent" rather than "not found by this method"; an
              accepted write or matching readback written up as "works"; a claim that cites no
              file in `evidence/`, `windows/decompiled/`, `bios/decompiled/`, `ec/decompiled/`,
              `ec/firmware/` or a tool run in this diff; or a confident phrasing where the
              evidence only supports a hedged one;
            - anything stating or implying a live test happened -- a register read back, a
              behaviour observed, a program run on Windows or on the laptop -- unless it is cited
              from a file already in `evidence/`. This pipeline has no hardware and no Windows
              machine; hardware work ships as preparation for a human to run;
            - a claim that is wrong on the evidence in the repository: check it yourself. Re-run
              the tool the PR relies on against the committed firmware (`ec/tools/*.py`,
              `ec/firmware/`), or `grep` the decompiled source for the symbol the PR cites,
              rather than trusting the PR's summary of what it found;
            - a retraction done by silent edit: an earlier conclusion in `docs/findings.md` or
              `ec/annotations/registers.yaml` rewritten or deleted instead of left visible with a
              correction next to it (the `docs/findings.md` §4 pattern);
            - `ec/annotations/registers.yaml` breaking its conventions: a `status:` value outside
              the existing vocabulary, or a register whose status the PR's own evidence changes
              left un-updated in the same PR;
            - a hand-edit to generated decompile output, a committed Ghidra `.gpr`/`.rep`, or a
              Ghidra XDATA symbol table, where the change belongs in that component's
              `annotations/ghidra-functions.csv` (the EC and BIOS have one; the Windows project
              does not yet) or in `registers.yaml`, and is then re-exported. Also a
              `.gpr`/`.rep` change with no matching change to an annotations file or a
              seed, and a `*.lock` file committed beside a project. The exception is
              `bios/decompiled/*.annotated.c`, which is the hand restatement by convention and is
              edited by hand -- but its machine-readable counterpart is
              `bios/annotations/ghidra-functions.csv`, and a change to one with no matching
              change to the other is a divergence, not a style choice;
            - an annotation row with an empty `evidence` cell, or a decompile failure read as a
              statement about the firmware. Ghidra's native decompiler can fail *silently* --
              `openProgram()` false with an empty message -- which looks exactly like "this code
              will not decompile"; if the toolchain is broken that is the finding, not the code
              (CLAUDE.md, "The Ghidra projects");
            - an issue or pull request opened, or prepared to be opened automatically, against
              any repository other than this one -- upstream work ships as a patch and
              description committed here, for a human to submit;
            - `vendor/` binaries modified, regenerated or removed -- they are committed inputs;
            - a gate weakened rather than satisfied -- `.github/scripts/agent-gates.sh` checks
              relaxed or a tool's self-test deleted or defanged;
            - work that does not actually implement the issue, or that quietly does more than the
              issue asked;
            - a new tool without a way to check it: an analysis script with no self-test or no
              recorded known-answer run against the committed firmware, when its output is what
              the PR's claims rest on.

            Reject, rather than request changes, only when fixing the findings would mean
            starting over: the approach cannot deliver what the issue asks, the issue was
            misread so the diff answers a different question, or the claim the pull request
            rests on is false and nothing around it stands without it. Many findings, or
            laborious ones, are not a reason to reject; findings the fix stage can work through
            are a request for changes. A rejected pull request is closed and the issue is
            planned again from scratch, with your summary and findings in front of the new
            plan, so write the `fix` fields as guidance for that new attempt: what it must do
            differently, not how to patch this diff.

            Do not block on style, naming, or preference. You may leave those as non-blocking
            suggestions; keep them few and worth the author's time. A change that is correct and
            tested but that you would have written differently is an approval.

            Your findings are the only review this pull request gets, and when you block, the fix
            stage works from them and nothing else. So each finding must stand on its own: the
            file and line it is about, what is wrong and the evidence for it, and what would
            resolve it. Write every text field as GitHub markdown -- backticks for paths,
            symbols, addresses and commands, short sentences -- and keep `summary` to two to four
            sentences; the lists go in `findings` and `verified`, which are rendered as the
            review.

            Return the verdict: `approved` true to merge, `rejected` true to close (never both;
            both false requests changes). If you approve, also return the final squash commit message:
            the title and body this should merge under, in house style — lowercase plain-language
            subject, body explaining the reasoning and the evidence, not restating the diff. If
            the approach changed while the branch was being fixed, describe what actually
            landed, not what was originally planned.
          # Bash(git:*) rather than four enumerated git prefixes, and the read-only gh verbs:
          # this is the merge gate, a denial costs it a turn, and an enumeration is a list of
          # what someone thought of. Task is here because a judgement this consequential should
          # be able to farm out a question it wants a second read on.
          #
          # What keeps this safe is the allowlist being default-deny: a gh verb absent from it is
          # refused without anyone having had to predict it. The denies below are redundant on
          # paper, and are here anyway because the cost of being wrong is the gate approving
          # itself or rewriting what judges it.
          #
          # gh pr comment and gh pr review are denied: this stage's whole output is the verdict
          # object, which the steps below post. A gate that can also write prose onto the pull
          # request has a second channel nothing reads, and can say something the verdict does
          # not.
          claude_args: >-
            --model stealth/space-bunny-alpha
            --effort max
            --dangerously-skip-permissions
            --allowedTools "Task,Read,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(rg:*),Bash(jq:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*)"
            --disallowedTools "Write,Edit,Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(gh workflow:*),Bash(gh run:*),Bash(gh secret:*),Bash(gh ruleset:*),Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(git push:*),Bash(git remote:*),Bash(git config:*),WebFetch,WebSearch"
            --json-schema '{"type":"object","properties":{"approved":{"type":"boolean","description":"True to approve and let this merge"},"rejected":{"type":"boolean","description":"True to close this pull request and have the issue planned again: only when fixing the findings would mean starting over. Never true together with approved"},"summary":{"type":"string","description":"Two to four sentences of GitHub markdown: what this pull request does and why it is or is not mergeable. No lists; those go in findings and verified"},"findings":{"type":"array","description":"Every blocking finding, then any non-blocking suggestion worth leaving. Empty when there is nothing to raise","items":{"type":"object","properties":{"blocking":{"type":"boolean","description":"True if this alone stops the merge"},"file":{"type":"string","description":"Repository path the finding is about, or empty for the pull request as a whole"},"line":{"type":"integer","description":"Line in the head version of that file, or 0"},"problem":{"type":"string","description":"Markdown: what is wrong, and the evidence you checked it against"},"fix":{"type":"string","description":"Markdown: what would resolve it"}},"required":["blocking","file","line","problem","fix"]}},"verified":{"type":"array","description":"Claims you re-checked yourself, one short markdown line each, naming the command or file that checked it","items":{"type":"string"}},"final_title":{"type":"string","description":"Squash commit subject, lowercase, house style"},"final_body":{"type":"string","description":"Squash commit body: reasoning and evidence"}},"required":["approved","rejected","summary","findings","verified","final_title","final_body"]}'

      - name: Record a stall
        if: steps.verdict.outcome != 'success' || steps.verdict.outputs.conclusion != 'success'
        uses: ./.github/actions/agent-stall
        with:
          issue: ${{ steps.ctx.outputs.issue }}
          pr: ${{ github.event.pull_request.number }}
          stage: review
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop here
        if: steps.verdict.outcome != 'success' || steps.verdict.outputs.conclusion != 'success'
        run: exit 1

      # jq rather than fromJSON() in an `if:` — see the note in agent-plan.yml. fromJSON on
      # the empty string a stalled run leaves behind fails template evaluation instead of
      # evaluating false, and takes every later step with it.
      - name: Unpack the verdict
        id: unpack
        env:
          OUT: ${{ steps.verdict.outputs.structured_output }}
        run: |
          set -euo pipefail
          jq -r '.final_title' <<<"$OUT" > /tmp/final-title.txt
          jq -r '.final_body'  <<<"$OUT" > /tmp/final-body.txt
          # A verdict that sets both is read as a rejection: the failure to guard against is
          # merging something the reviewer also said to throw away.
          echo "approved=$(jq -r '(.approved and (.rejected | not)) | tostring' <<<"$OUT")" >> "$GITHUB_OUTPUT"
          echo "rejected=$(jq -r '.rejected | tostring' <<<"$OUT")" >> "$GITHUB_OUTPUT"
          # The review body. Continuation lines are indented so a multi-line problem stays inside
          # its list item.
          jq -r '
            def indent: gsub("\n"; "\n  ");
            def loc: if .file == "" then "" else "`\(.file)\(if .line > 0 then ":\(.line)" else "" end)`: " end;
            def item: "- \(loc)\(.problem | indent)"
                      + (if .fix == "" then "" else "\n\n  **Fix:** \(.fix | indent)" end);
            [ .findings[] | select(.blocking) ] as $b
            | [ .findings[] | select(.blocking | not) ] as $s
            | [ (if .rejected then "**Rejected.** This pull request is closed and the issue goes back to be planned again; the findings below are what the next attempt has to do differently."
                 elif .approved then "**Approved.**"
                 else "**Changes requested:** \($b | length) blocking finding\(if ($b | length) == 1 then "" else "s" end)."
                 end),
                "",
                .summary,
                (if ($b | length) > 0 then "", "### Blocking", "", ($b[] | item, "") else empty end),
                (if ($s | length) > 0 then "", "### Suggestions (non-blocking)", "", ($s[] | item, "") else empty end),
                (if (.verified | length) > 0
                 then "", "<details><summary>Checked by the reviewer</summary>", "", (.verified[] | "- \(.)"), "", "</details>"
                 else empty end)
              ] | join("\n")' <<<"$OUT" > /tmp/review.md

      - name: Capture the findings for the fix stage
        id: findings
        if: steps.unpack.outputs.approved != 'true' && steps.unpack.outputs.rejected != 'true'
        run: |
          set -euo pipefail
          {
            echo 'text<<REVIEW_EOF'
            head -c 20000 /tmp/review.md ; printf '\n'
            echo 'REVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

      # Approving rewrites the title and body, because they are the squash commit message
      # verbatim (the repository's squash default is "pull request title and description") and
      # eight fix rounds may have left the original describing an approach that was abandoned.
      # The scratch marker and everything under it goes: it is gate reporting, not history.
      - name: Approve
        if: steps.unpack.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
        run: |
          set -euo pipefail
          # A needs-hardware-test issue is the live run, and this pull request only prepares it.
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx 'needs-hardware-test'; then
            link="Refs #${ISSUE} -- left open: it is the live run this prepares, for a human at the machine to close."
          else
            link="Closes #${ISSUE}."
          fi
          {
            cat /tmp/final-body.txt
            printf '\n%s\n' "$link"
          } > /tmp/pr-final.md
          gh pr edit "$PR" --title "$(cat /tmp/final-title.txt)" --body-file /tmp/pr-final.md
          gh pr review "$PR" --approve --body-file /tmp/review.md

      - name: Request changes
        if: steps.unpack.outputs.approved != 'true' && steps.unpack.outputs.rejected != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR" --request-changes --body-file /tmp/review.md

      # The PAT closes the pull request and deletes the branch, because this job's GITHUB_TOKEN
      # is contents: read. The issue body is rewritten before the labels change, so a plan the
      # sweep starts as soon as `agent:queued` appears cannot read the old plan without the
      # rejection above it.
      - name: Reject
        if: steps.unpack.outputs.rejected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
          # CUSTOMISE: how many rejections of one issue before a human takes it.
          MAX_REJECTIONS: '2'
        run: |
          set -euo pipefail
          gh pr review "$PR" --request-changes --body-file /tmp/review.md
          GH_TOKEN="$PUSH_TOKEN" gh pr close "$PR" --delete-branch \
            --comment "Rejected by the review stage: see the review above. The issue goes back to be planned again."

          rejections=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" \
                         --jq '[.[] | select(.user.type == "Bot") | .body
                                    | select(test("<!-- agent-rejected -->"))] | length')
          rejections=$(( rejections + 1 ))

          gh issue view "$ISSUE" --json body --jq .body > /tmp/old-body.md
          {
            printf '## Attempt %s was rejected (PR #%s)\n\n' "$rejections" "$PR"
            printf 'Planning again, read this first: the review below is why the last attempt was closed rather than fixed.\n\n'
            cat /tmp/review.md
            printf '\n\n<details><summary>The plan that was rejected</summary>\n\n'
            cat /tmp/old-body.md
            printf '\n</details>\n'
          } > /tmp/new-body.md
          gh issue edit "$ISSUE" --body-file /tmp/new-body.md

          if [ "$rejections" -ge "$MAX_REJECTIONS" ]; then
            gh issue comment "$ISSUE" --body "PR #${PR} was rejected, and that is rejection ${rejections} of this issue, so it is being handed to a human rather than planned again. Remove the \`agent:stuck\` label and add \`agent:queued\` to let the pipeline try once more. <!-- agent-rejected -->"
            gh issue edit "$ISSUE" --add-label 'agent:stuck'
          else
            gh issue comment "$ISSUE" --body "PR #${PR} was rejected (rejection ${rejections} of ${MAX_REJECTIONS}). The review is now at the top of this issue, and the retry sweep will plan it again from here. <!-- agent-rejected -->"
            gh issue edit "$ISSUE" --add-label 'agent:queued'
          fi
          # Separate and allowed to fail, like agent-plan.yml's removal of `agent:queued`: an
          # issue carries one of these, not both, and removing an absent label is an error.
          gh issue edit "$ISSUE" --remove-label 'agent:working' || true
          gh issue edit "$ISSUE" --remove-label 'agent:planned' || true

  fix:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    needs: [review]
    if: needs.review.outputs.approved == 'false' && needs.review.outputs.rejected != 'true'
    uses: ./.github/workflows/agent-fix.yml
    secrets:
      AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      pr: ${{ github.event.pull_request.number }}
      issue: ${{ needs.review.outputs.issue }}
      author: ${{ needs.review.outputs.author }}
      reason: review
      payload: ${{ needs.review.outputs.findings }}
