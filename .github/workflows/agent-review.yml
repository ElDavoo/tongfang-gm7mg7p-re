name: Agent · review

# The review leg of the loop, and the merge gate. Runs on every push to an agent branch, in
# parallel with CI rather than after it: the two are independent judgements, and
# serialising them would add a full CI round-trip to every review cycle. Auto-merge waits for
# both regardless, so parallel costs nothing in correctness.
#
# The approving review is submitted with GITHUB_TOKEN, so it lands as github-actions[bot] --
# a different identity from the pull request's author, which is what keeps GitHub's
# self-approval block from firing. It requires Settings -> Actions -> "Allow GitHub Actions to
# create and approve pull requests"; see README.md.
#
# There is no human downstream of this stage. The prompt says so, deliberately: a reviewer that
# believes someone will catch its misses drifts one way, and one that believes it is the last
# gate drifts the other, and the second drift is the one this pipeline can afford.

on:
  pull_request:
    # `reopened` is here so a review can be re-triggered by closing and reopening the pull
    # request. Re-running the workflow run itself is not equivalent: a re-run replays the
    # workflow file as it was, so it cannot pick up a fix to this file.
    types: [opened, synchronize, reopened]

# Granted per job rather than here: a workflow-level block hands the same token to the gate
# as to the stage that runs the agent, and the gate exists precisely to decide whether the
# agent should run at all.
permissions: {}

# The pipeline-wide serial group; agent-plan.yml carries the reasoning. cancel-in-progress had to
# go from true to false along with it, and not only because a shared group must never cancel
# across stages -- with it still set, a push to any agent branch would cancel whatever implement
# or fix run happened to hold the group. What it used to buy is bought by the queue instead: a
# group holds one pending run, so a burst of pushes to the same branch displaces the older
# waiting reviews and leaves the newest, which is the one worth running anyway.
concurrency:
  group: agent-pipeline/${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    if: >-
      startsWith(github.head_ref, 'agent/issue-')
      && !github.event.pull_request.draft
      && !contains(github.event.pull_request.labels.*.name, 'agent:stop')
      && !contains(github.event.pull_request.labels.*.name, 'agent:stuck')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      approved: ${{ steps.unpack.outputs.approved }}
      findings: ${{ steps.findings.outputs.text }}
      issue: ${{ steps.ctx.outputs.issue }}
      author: ${{ steps.ctx.outputs.author }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Identify the issue behind the branch
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          issue=${BRANCH#agent/issue-}
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "author=$(gh issue view "$issue" --json author --jq .author.login)" >> "$GITHUB_OUTPUT"

      # The verdict, as data. It is a separate pass from the inline review further down because a
      # merge gate must be a value the workflow can branch on rather than prose someone has to
      # parse -- and it goes *first*, which it did not, because this is the pass that decides
      # whether the run survives at all. A review run measured here spent 6m43s on the inline
      # pass, posted nothing, and then lost the verdict in ten seconds; everything the inline
      # pass had cost went with the failed run, and the retry re-ran both from scratch. In this
      # order a stall costs ten seconds of the window instead of seven minutes.
      - name: Verdict
        id: verdict
        # See agent-plan.yml. A stalled verdict is the quietest failure in the pipeline: CI goes
        # green, auto-merge stays armed, and nothing ever approves — so the pull request sits
        # looking finished. The `fix` job below is skipped automatically once this job fails.
        continue-on-error: true
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          # Keep plugin/subagent aliases on the same provider and model.
          ANTHROPIC_DEFAULT_OPUS_MODEL: stealth/space-bunny-alpha
          ANTHROPIC_DEFAULT_SONNET_MODEL: stealth/space-bunny-alpha
          ANTHROPIC_DEFAULT_HAIKU_MODEL: stealth/space-bunny-alpha
          CLAUDE_CODE_SUBAGENT_MODEL: stealth/space-bunny-alpha
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: 950000
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            You are the merge gate for pull request #${{ github.event.pull_request.number }},
            which implements issue #${{ steps.ctx.outputs.issue }}. It was written by an agent.
            The branch is checked out; `git diff origin/main...HEAD` is the change.

            There is no human reviewer after you. If you approve, this merges to main once CI is
            green. Read CLAUDE.md — it documents the invariants that lint and the tests will not
            catch a change breaking, and it is the standard you are holding this to.

            Block on, and only on:
            - an overclaim -- the rule CLAUDE.md puts above every other. That means: a zero-hit
              static scan written up as "absent" rather than "not found by this method"; an
              accepted write or matching readback written up as "works"; a claim that cites no
              file in `evidence/`, `windows/decompiled/`, `bios/decompiled/`, `ec/decompiled/`,
              `ec/firmware/` or a tool run in this diff; or a confident phrasing where the
              evidence only supports a hedged one;
            - anything stating or implying a live test happened -- a register read back, a
              behaviour observed, a program run on Windows or on the laptop -- unless it is cited
              from a file already in `evidence/`. This pipeline has no hardware and no Windows
              machine; hardware work ships as preparation for a human to run;
            - a claim that is wrong on the evidence in the repository: check it yourself. Re-run
              the tool the PR relies on against the committed firmware (`ec/tools/*.py`,
              `ec/firmware/`), or `grep` the decompiled source for the symbol the PR cites,
              rather than trusting the PR's summary of what it found;
            - a retraction done by silent edit: an earlier conclusion in `docs/findings.md` or
              `ec/annotations/registers.yaml` rewritten or deleted instead of left visible with a
              correction next to it (the `docs/findings.md` §4 pattern);
            - `ec/annotations/registers.yaml` breaking its conventions: a `status:` value outside
              the existing vocabulary, or a register whose status the PR's own evidence changes
              left un-updated in the same PR;
            - a hand-edit to generated decompile output, a committed Ghidra `.gpr`/`.rep`, or a
              Ghidra XDATA symbol table, where the change belongs in that component's
              `annotations/ghidra-functions.csv` (the EC and BIOS have one; the Windows project
              does not yet) or in `registers.yaml`, and is then re-exported. Also a
              `.gpr`/`.rep` change with no matching change to an annotations file or a
              seed, and a `*.lock` file committed beside a project. The exception is
              `bios/decompiled/*.annotated.c`, which is the hand restatement by convention and is
              edited by hand -- but its machine-readable counterpart is
              `bios/annotations/ghidra-functions.csv`, and a change to one with no matching
              change to the other is a divergence, not a style choice;
            - an annotation row with an empty `evidence` cell, or a decompile failure read as a
              statement about the firmware. Ghidra's native decompiler can fail *silently* --
              `openProgram()` false with an empty message -- which looks exactly like "this code
              will not decompile"; if the toolchain is broken that is the finding, not the code
              (CLAUDE.md, "The Ghidra projects");
            - an issue or pull request opened, or prepared to be opened automatically, against
              any repository other than this one -- upstream work ships as a patch and
              description committed here, for a human to submit;
            - `vendor/` binaries modified, regenerated or removed -- they are committed inputs;
            - a gate weakened rather than satisfied -- `.github/scripts/agent-gates.sh` checks
              relaxed or a tool's self-test deleted or defanged;
            - work that does not actually implement the issue, or that quietly does more than the
              issue asked;
            - a new tool without a way to check it: an analysis script with no self-test or no
              recorded known-answer run against the committed firmware, when its output is what
              the PR's claims rest on.

            Do not block on style, naming, or preference. A second pass runs after you and leaves
            those inline on the pull request; they are not yours to raise here. A change that is
            correct and tested but that you would have written differently is an approval.

            Return the verdict. If you approve, also return the final squash commit message:
            the title and body this should merge under, in house style — lowercase plain-language
            subject, body explaining the reasoning and the evidence, not restating the diff. If
            the approach changed while the branch was being fixed, describe what actually
            landed, not what was originally planned.
          # Bash(git:*) rather than four enumerated git prefixes, and the read-only gh verbs, for
          # the reasons set out on the inline pass below: this is the merge gate, a denial costs
          # it a turn, and an enumeration is a list of what someone thought of. Task is here
          # because a judgement this consequential should be able to farm out a question it wants
          # a second read on, the way the plugin does.
          #
          # gh pr comment is denied here though the inline pass is allowed it. The two are not the
          # same job: that one is the reviewer and talks to the author, this one is the gate and
          # its whole output is the verdict object. A gate that can also write prose onto the
          # pull request has a second channel nothing reads, and can say something the verdict
          # does not.
          claude_args: >-
            --model stealth/space-bunny-alpha
            --effort max
            --dangerously-skip-permissions
            --allowedTools "Task,Read,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(rg:*),Bash(jq:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*)"
            --disallowedTools "Write,Edit,Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(gh workflow:*),Bash(gh run:*),Bash(gh secret:*),Bash(gh ruleset:*),Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(git push:*),Bash(git remote:*),Bash(git config:*),WebFetch,WebSearch"
            --json-schema '{"type":"object","properties":{"approved":{"type":"boolean","description":"True to approve and let this merge"},"blocking":{"type":"integer","description":"Number of blocking findings"},"summary":{"type":"string","description":"One paragraph: what this does and why it is or is not mergeable"},"final_title":{"type":"string","description":"Squash commit subject, lowercase, house style"},"final_body":{"type":"string","description":"Squash commit body: reasoning and evidence"}},"required":["approved","blocking","summary","final_title","final_body"]}'

      - name: Record a stall
        if: steps.verdict.outcome != 'success' || steps.verdict.outputs.conclusion != 'success'
        uses: ./.github/actions/agent-stall
        with:
          issue: ${{ steps.ctx.outputs.issue }}
          pr: ${{ github.event.pull_request.number }}
          stage: review
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop here
        if: steps.verdict.outcome != 'success' || steps.verdict.outputs.conclusion != 'success'
        run: exit 1

      # jq rather than fromJSON() in an `if:` — see the note in agent-plan.yml. fromJSON on
      # the empty string a stalled run leaves behind fails template evaluation instead of
      # evaluating false, and takes every later step with it.
      - name: Unpack the verdict
        id: unpack
        env:
          OUT: ${{ steps.verdict.outputs.structured_output }}
        run: |
          set -euo pipefail
          jq -r '.summary'     <<<"$OUT" > /tmp/summary.txt
          jq -r '.final_title' <<<"$OUT" > /tmp/final-title.txt
          jq -r '.final_body'  <<<"$OUT" > /tmp/final-body.txt
          echo "approved=$(jq -r '.approved | tostring' <<<"$OUT")" >> "$GITHUB_OUTPUT"

      # The inline findings, using the same plugin invocation the repository already used for
      # human-authored pull requests. It runs after the verdict and not before it -- the note on
      # that step says why -- and unconditionally either way: these comments are the payload the
      # fix stage is handed when the verdict blocks, and the non-blocking remarks worth leaving
      # when it does not.
      - name: Inline review
        continue-on-error: true
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          # Keep plugin/subagent aliases on the same provider and model.
          ANTHROPIC_DEFAULT_OPUS_MODEL: stealth/space-bunny-alpha
          ANTHROPIC_DEFAULT_SONNET_MODEL: stealth/space-bunny-alpha
          ANTHROPIC_DEFAULT_HAIKU_MODEL: stealth/space-bunny-alpha
          CLAUDE_CODE_SUBAGENT_MODEL: stealth/space-bunny-alpha
          CLAUDE_CODE_EFFORT_LEVEL: max
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: 950000
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # --allowedTools is an allowlist, not an addition to a default, so this has to name
          # everything the plugin's procedure actually uses -- and that procedure is subagents
          # almost end to end. commands/code-review.md dispatches a Haiku triage agent, a Haiku
          # CLAUDE.md locator, a Haiku summariser, five parallel Sonnet reviewers and one Haiku
          # scorer per finding, then posts with `gh`. Without Task it has no way to perform a
          # single one of its steps, and a blanket Bash(gh:*) denial takes the rest: the
          # plugin's own frontmatter declares seven gh verbs and every one of them was denied.
          #
          # Run 33022803884 was that with no read tools at all -- ten denials, nothing posted.
          # Run 33035520610 was that with the read tools and still no Task or gh: seven denials,
          # and the top-level model fell off the procedure entirely, reviewed the diff by hand
          # and reported in its approval that it had "left inline" a remark that does not exist.
          # The action's own post-step logged "No buffered inline comments" both times.
          #
          # What keeps this safe is the allowlist being default-deny: a gh verb absent from it is
          # refused without anyone having had to predict it, which is the property an enumerated
          # deny-list does not have. The denies below are therefore redundant on paper, and are
          # here anyway because this stage is the merge gate and the cost of being wrong is it
          # approving itself or rewriting what judges it. Prefix matching on a chained command
          # is not a thing worth betting the gate on.
          claude_args: >-
            --model stealth/space-bunny-alpha
            --effort max
            --dangerously-skip-permissions
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Task,Read,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(rg:*),Bash(jq:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*)"
            --disallowedTools "Write,Edit,Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh api:*),Bash(gh workflow:*),Bash(gh run:*),Bash(gh secret:*),Bash(gh ruleset:*),Bash(curl:*),Bash(wget:*),Bash(nc:*),Bash(ssh:*),Bash(scp:*),Bash(git push:*),Bash(git remote:*),Bash(git config:*),WebFetch,WebSearch"

      - name: Capture the findings for the fix stage
        id: findings
        if: steps.unpack.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo 'text<<REVIEW_EOF'
            cat /tmp/summary.txt ; printf '\n'
            echo 'Inline comments left on the pull request:'
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments" \
              --jq '.[] | "- \(.path):\(.line // .original_line) — \(.body)"' | tail -c 20000
            echo ''
            echo 'REVIEW_EOF'
          } >> "$GITHUB_OUTPUT"

      # Approving rewrites the title and body, because they are the squash commit message
      # verbatim (the repository's squash default is "pull request title and description") and
      # eight fix rounds may have left the original describing an approach that was abandoned.
      # The scratch marker and everything under it goes: it is gate reporting, not history.
      - name: Approve
        if: steps.unpack.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ISSUE: ${{ steps.ctx.outputs.issue }}
        run: |
          set -euo pipefail
          {
            cat /tmp/final-body.txt
            printf '\nCloses #%s.\n' "$ISSUE"
          } > /tmp/pr-final.md
          gh pr edit "$PR" --title "$(cat /tmp/final-title.txt)" --body-file /tmp/pr-final.md
          gh pr review "$PR" --approve --body-file /tmp/summary.txt

      - name: Request changes
        if: steps.unpack.outputs.approved != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR" --request-changes --body-file /tmp/summary.txt

  fix:
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    needs: [review]
    if: needs.review.outputs.approved == 'false'
    uses: ./.github/workflows/agent-fix.yml
    secrets:
      AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    with:
      pr: ${{ github.event.pull_request.number }}
      issue: ${{ needs.review.outputs.issue }}
      author: ${{ needs.review.outputs.author }}
      reason: review
      payload: ${{ needs.review.outputs.findings }}
