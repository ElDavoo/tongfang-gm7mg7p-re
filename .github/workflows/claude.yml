name: Claude · mention

# Added by /install-github-app (Anthropic's standard quickstart template), not by
# agent-pipeline. Kept for what it does that the pipeline doesn't -- an ad-hoc "@claude, ..."
# conversation on an issue or PR comment, without going through plan/implement -- but two
# things about it needed fixing to coexist with the pipeline rather than fight it:
#
#   - It shares no concurrency group with agent-plan.yml/agent-implement.yml/agent-review.yml/
#     agent-fix-ci.yml, and its own trigger list (any comment containing "@claude", on anything)
#     overlaps theirs directly. As shipped, an "@claude" reply on an agent-authored pull request
#     mid-review runs a second, fully independent Claude session in parallel with whatever the
#     pipeline is doing, against the same CLAUDE_CODE_OAUTH_TOKEN budget -- exactly what the
#     shared `agent-pipeline` group exists to prevent. Fixed below by joining that group.
#   - Its sibling template, claude-code-review.yml, triggered on the same pull_request events
#     agent-review.yml already covers and was removed outright rather than reconciled: it
#     duplicated that stage's job with none of its trust model, and every PR would otherwise
#     have been reviewed twice by two independently-configured mechanisms.
#
# What's still true of this file, unchanged, and worth knowing rather than silently fixing:
# the `if:` below checks only for the literal text "@claude" -- unlike agent-plan.yml's
# collaborator-permission triage, it does not check who wrote it. On a private single-owner
# repo that is nobody but the owner; it stops being nobody the day this repo gains a
# collaborator or goes public, at which point anyone who can comment can run an agent session
# with this action's full default tool access and no approval gate. Add a triage job matching
# agent-plan.yml's if either of those happens, rather than assume this comment still applies.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # On the job, not the workflow: this workflow's own trigger list fires on every issue/PR
    # comment and every issue opened, almost none of which mention "@claude". A workflow-level
    # group is claimed before the `if:` above is ever evaluated, so every one of those events
    # would queue against agent-plan.yml/agent-implement.yml regardless of doing nothing once
    # queued -- confirmed in this repo's own Actions history the night this was fixed: several
    # "Claude · mention" runs show conclusion "cancelled" (not "skipped") at the exact
    # timestamps new issues were filed, competing for the same slot agent-plan.yml needed.
    concurrency:
      group: agent-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        # Pinned to the v4 release this template shipped with, not the v7 the rest of this
        # repo's own workflows use -- that pin is a deliberate, separate upgrade this file
        # wasn't touched for.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        # Pinned to the same commit every other claude-code-action call in this repo uses,
        # for consistency, not because it's the newest -- the v1 tag has moved past this
        # commit since (verified 2026-09-14: v1 -> a73a99c, this pin -> 1f291e1). Upgrading
        # it here alone would make this the only stage running different code from the rest
        # of the pipeline; a version bump belongs in a change that moves every pin together.
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

