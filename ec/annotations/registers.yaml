      to \_SB.NPCF, so what the notification is for is not recovered here.
      windows/tools/t1wr_callers.py has never searched for a caller of
      0x1176: its ACPI_ARGS still reads [0x1171, 0x1172, 0x1173, 0x2273].
      Widening it re-bakes that tool's expected-count tables and
      docs/findings.md 4f's figures, so it is a follow-up rather than a
      line here; the gap is recorded in
      ec/annotations/ec-07d6-07d7-sites.md section 8.
      All 71 direct MOV DPTR sites are in the ITE8850-PD image and none is
      in the EC firmware, so the 71 are the PD program's own variable and
      not references to an EC register. Status is unknown-not-absent for
      the reason this file's header gives that value, not
      present-untested, and not absent (docs/findings.md 4c).
      WALKED 2026-09-24 (issue #282): all 71 sites are enumerated in
      ec/annotations/ec-07d6-07d7-sites.md (site table
      ec-07d6-07d7-sites.csv), reconciled in section 1 against
      xdata-registers.csv's census (cluster pd-029: 35 refs -- 16 read,
