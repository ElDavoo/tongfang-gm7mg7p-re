      the name collision when grepping: MyRgbLightbarManager*.SetApExist
      has the same name and the same bit-0 idiom and writes 0x0748, not
      this byte (MyRgbLightbarManager.cs:547-555). NOT FOUND by
      trace_xdata_refs.py over this image, across all 7 sites: anything
      that clears bit 0, or reads it. 0xAD0D and 0xCD11 clear bit 6,
      0xB13A clears bits 4-5, the three read sites test bit 6 or bits
      4-5, and nothing masks with 0xFE -- so what cleared it on
      2026-09-19 is still unexplained, and a zero here is "not found by
      this method", never "absent" (see the xdata-refs and absent notes
      at the top of this file; 0x07B0-0x07BE is a documented blind spot
      of the scan this census comes from).

