  - name: GPU_DYNAMIC_BOOST_STATUS (DSDT DBEN bit 3, DBST bit 5)
    addr: 0x07C4
    bits: "0-2 unnamed; 3 = DBEN; 4 unnamed; 5 = DBST"
    sources: [dsdt(DBEN/DBST), live]
    static_refs: 8
    static_refs_main_ec: 5
    static_refs_pd_image: 3
    status: present-untested
    note: >
      The head of the 0x07C4-0x07D7 block docs/findings.md 4o reads as a
      GPU dynamic-boost control block, and the ASL's only use of this byte is
      to test DBEN (dsdt.dsl:50702 in T1WR's Arg0 == 0x73 branch, and
      dsdt.dsl:52796 in _Q84) -- it never writes the byte. The DSDT ECMG
      field list (dsdt.dsl:52238-52242) is three unnamed bits, DBEN, one
      unnamed, DBST, so DBEN is bit 3 and DBST is bit 5; 4o's own bit-0
      reading is corrected in place there.
      *** CORRECTION to that bit-0 reading: DBEN is bit 3, not bit 0, and
      the ASL sites test the named 1-bit field rather than bit 0. This entry
      is named for the ASL's own field names rather than for what the bits
      do, which is not established. ***
      No committed Windows input writes it: ec-callsites-summary.csv has no
      0x07C4 row (0x07C5 has ten writers, 0x07D3 one read), and 1988 is
      absent from windows/decompiled/v3.1.6.0/ECSpec.cs, whose ADDR_AP_OEM
      constants step straight from 1987 to ADDR_AP_OEM_BYTE5 = 1989. The
      writer is therefore the EC firmware or firmware outside the committed
      inputs.
      The five EC-firmware sites are walked in
      ec/annotations/ec-07c4-07d5-sites.md (site table
      ec-07c4-07d5-sites.csv). Four sit in one routine entered at 0x83FF:
      two reads that lift bits 4 and 3 into R7/R6 and compare them, and a
      read-modify-write at 0x8483/0x8490 that sets bit 3 to follow bit 4
      (orl a,#0x08 / anl a,#0xf7). The fifth, 0x94C1, is a read-modify-write
      driven by R7: a non-zero R7 ORs 0x10 in, a zero one ANDs it with
      0xEF, so that site sets and clears bit 4 -- and its one direct caller,
      0x9711, passes bit 1 of 0x0743 (CTGP_DB_CTRL) in R7. So the EC image
      contains a bit-3 writer and a bit-4 writer for the byte the ASL gates
      on. That the 0x8483/0x8490 pair is the same gate the ASL calls DBEN is
      an inference from the bytes, not a decode of what the routine is for.
      Counts are direct MOV DPTR site counts and inherit this file's header
      caveats: a computed DPH or an indirect movx @Ri is invisible to the
      scan (issue #110, and the 0x07B9 retraction), so 5 is a lower bound,
      and a write class is an instruction storing to the address, not
      evidence the EC acts on it.
      SEEN LIVE 2026-09-23, unattributed:
      evidence/ec-watch/2026-09-23-power-mode-cycle-0700-07ff.csv carries two
      rows for this byte, 0x08 -> 0x28 at 17:57:51.161 and 0x28 -> 0x38 at
      17:57:51.597, 0.44 s apart at the AC plug-in where 0x0743/0x0745/
      0x0746 land. Nothing in that capture attributes them, and no committed
      input writes the byte at all, so who wrote them is open. Scope: the
      first sets bits 3 and 5, the second sets bit 4 -- and bit 3 was
      therefore already set in the 0x08 baseline, which is a question about
      the baseline rather than a confirmation of the ASL's test. The same
      capture shows 0x07D0 and 0x07D1 did not move across an AC plug-in or
      six Fn-key mode switches, which is new information about those two
      bytes. No register was written or read back to establish any of this;
      the 2026-09-23 capture is quoted as a committed file, not as a result
      of anything done here. Status stays present-untested: a passive capture
      showing a byte move is not a live test of it.

