# EC register cross-reference for TongFang GM7MG7P / GM5MG7Y, ITE EC-V14.6
# (file ec/firmware/GMxMGxx_11.800), PROJECT_ID_CML_GAMING (0x0F).
#
# Sources, tagged per-register below:
#   uniwill-laptop : linux/drivers/platform/x86/uniwill/uniwill-acpi.c address/bit defines
#   ecspec-3.1.6.0 : Define.ECSpec constants from the unobfuscated Windows service
#                    (windows/decompiled/v3.1.6.0/ECSpec.cs)
#   static-scan    : ec/tools/scan_refs.py reference count against the EC image
#                    (CAVEAT: that count is file-wide, and the 256 KiB dump holds
#                    TWO 8051 programs -- the EC firmware at file 0x00000-0x17FFF
#                    and a separate ITE8850-PD USB-PD image at 0x20000-0x2FFFF,
#                    with its own vectors and its own XDATA map. Refs in the PD
#                    image are not refs to an EC register. ec/tools/trace_xdata_refs.py
#                    splits a count per image. See
#                    ec/annotations/lightbar-bat-flow.md. "Its own XDATA map"
#                    was an assumption until 0x04A6, the one address with
#                    sites in both images, was decoded both ways in
#                    ec/annotations/pd-xdata-overlap.md; it held there, on
#                    static evidence, which is not the same as proven.)
#   xdata-refs      : ec/tools/trace_xdata_refs.py -- the per-site form of the
#                    same scan: which image each site is in, its runtime
#                    address, and whether it reads, writes, or hands DPTR to a
#                    subroutine. Site table and the pages it covers:
#                    ec/annotations/xdata-0400-045f.md and
#                    ec/annotations/xdata-06c2-06db-timers.md. It is still a
#                    static scan and is NOT `live`: a zero is "not found by
#                    this method", never "absent", and a read-modify-write is
#                    evidence the EC touches a byte, not that it acts on it.
#                    The access column is a linear walk that stops at the first
#                    control-flow instruction, so a store a branch jumps over is
#                    invisible to it -- the timer block's one reload is exactly
#                    such a store (xdata-06c2-06db-timers.md 5).
#                    The INDIRECT addressing mode is a separate scan and a
#                    separate caveat: ec/tools/find_indirect_xdata.py looks for
#                    `movx @Ri`, whose page is in P2 and whose low byte is in a
#                    register, and finds 37 such sites in the EC image of which
#                    none resolves to an address. (Correction: this caveat said
#                    44. The walk did not know about the main EC's `0x7151`
#                    case tables and decoded their bytes as instructions; the
#                    seven lost rows were table data, and the corrected walk
#                    removes them. docs/findings/7151-case-tables-in-the-walk.md
#                    is the write-up, and the population is that tool's output
#                    rather than a figure to carry here.)
#                    `mov p2,#imm` occurs 0 times
#                    in this image, with the same query finding 529 for
#                    `mov b,#imm`, so the common literal-P2 idiom is not in
#                    this firmware at all. That is a fact about the FORM, not
#                    about the register: P2 set from a register or a table, set
#                    across a call, `mov @Ri,#data` and @dptr walks are all
#                    outside that scan, and the 12 `mov p2,register` it does
#                    report turn out to be a data table its own walk decoded as
#                    code. The smaller population is a WEAKER negative, not a
#                    cleaner one: no site behind it was ever checked for being
#                    real code, and the two single-site `P2` rows that survive
#                    look like ascending-step data by a second route.
#                    ec/annotations/indirect-xdata-sites.md 5 is the full
#                    list of what it does not establish. No `status:` below
#                    moves on the strength of it, in either direction.
#                    A further scan covers a further spelling, and is a
#                    further caveat: ec/tools/computed_dptr_sites.py looks for
#                    `add a,#imm` / `addc a,#imm` feeding `mov 0x83,a` -- a
#                    16-bit DPTR assembled in the accumulator over two
#                    instructions, with the address in neither of them. It finds
#                    exactly 8 sites on page 0x0F, all in bank0, at 0x8AC6,
#                    0x8AD8, 0x8AF3, 0x8B0C, 0xBCE3, 0xBDEC, 0xE86B and 0xF312
#                    -- the hand-decode ec/annotations/manual-fan-ctrl-0751.md
#                    6 already records, and the worked counter-example against
#                    reading "zero direct sites for 0x0F00" as an absence.
#                    Still outside it: a DPTR built from a stored pointer or a
#                    table, one handed in through a subroutine's own DPL/DPH
#                    writes, the `add a,rN` / `addc a,rN` register forms, and
#                    CODE jump tables. It also answers a page by `--page`, and
#                    0x07 is reached by no site it can establish -- which
#                    narrows what the 0x07B9 and 0x07D0 zeros below license
#                    and contradicts neither row. ec/annotations/
#                    computed-dptr-sites.md 7 carries the same list. 0x0F00 is
#                    deliberately still absent from this file:
#                    tools/check_power_profile.py rule 2 requires it, and these
#                    sites say what the EC reaches, not what it does with the
#                    byte.
#
# reference-count keys (all three are direct MOV DPTR,#addr site counts,
# and all three inherit the blind spot in the "absent" note below):
#   static_refs          : file-wide total over all 256 KiB, as scan_refs.py
#                          reports it. Kept verbatim; it is the number older
#                          notes in this repo quote.
#   static_refs_main_ec  : sites in the EC firmware itself (file 0x00000-0x17FFF:
#                          common area + CODE banks 0 and 1).
#   static_refs_pd_image : sites in the ITE8850-PD image (file 0x20000-0x2FFFF),
#                          which are references to a different program's XDATA.
# Every entry carries the split; an entry without it has not been audited.
# The recorded numbers are reproducible from the committed image, and
# ec/tools/check_register_counts.py recomputes them and fails on a mismatch.
# The per-address audit, with the command that produced it, is in
# ec/annotations/static-refs-audit.md. None of the three is a count of
# *register accesses*: a site can build a CODE pointer or hand DPTR to a
# subroutine instead. What each site does is classified per address in
# 5 of that file, from ec/tools/register_ref_table.py.
#   live           : read back on real hardware via regmap debugfs / /dev/mem
#   dsdt           : mentioned in evidence/acpi/dsdt.dsl ECMG field list
#
# status values:
#   confirmed-working   : live behaviour matches the driver's model
#   confirmed-working-partially : live behaviour matches for the part of the
#                            entry it was tested on and not the rest
#                            (0x07A6: the profile write changes the early-exit
#                            taper, and does not cap charging)
#   confirmed-inert      : write accepted, EC does not act on it (proven live)
#                            (declared and currently unused: the one entry
#                            downgraded out of it, 0x0726, sits at `absent`
#                            with its own note saying the real verdict is
#                            unknown. Naming the state is not the same as
#                            grading anything with it.)
#   confirmed-not-this-mechanism : the live test refutes the mechanism this
#                            entry names rather than the byte's existence
#                            (0x0748-0x074B: a lightbar on a chassis whose
#                            lightbar is a USB HID device, with three
#                            independent corroborations and no site in
#                            either image)
#   present-untested     : static-scan finds real references, not yet exercised live
#   absent                : static-scan finds zero direct references
#                            (NOTE: absence is not proof -- see docs/findings.md,
#                            "Static-scan validation" and "Retraction". 0x07B0-0x07BE
#                            is a known blind spot: Windows writes 0x07B9 and it works,
#                            but no direct MOV DPTR reference exists anywhere in image.)
#   unknown-not-absent   : the references that made it look present turned out to
#                            belong to the PD image, so the EC image has none -- and
#                            per the note above that is not "absent" either
#   -DO-NOT-WRITE-BLIND   : not a value, a suffix any value above may carry --
#                            read "that value, and a blind write to it is
#                            unsafe": a byte Windows demonstrably writes with
#                            no traceable EC-side handler, so the suffix warns
#                            without re-grading (0x07D0, 0x07D1). It is spelled
#                            appended, `unknown-not-absent-DO-NOT-WRITE-BLIND`,
#                            and it does not launder the value it rides on.
#
# Three rules hold this vocabulary together, and ec/tools/check_status_vocabulary.py
# enforces all three in the agent gate (its `--self-test` is the refusals themselves).
# docs/findings/pd-only-status-vocabulary.md is the write-up for rule 2 and
# docs/findings/handoff-site-warrant.md for rule 3.
#
#   1. Every `status:` is one of the values declared above, with the declared
#      suffix if any. The list above is parsed out of this comment by that
#      tool, not copied into it, so the two cannot drift apart silently.
#   2. `present-untested` is the one value whose whole warrant is a reference
#      count, so it requires static_refs_main_ec >= 1 for EVERY address in the
#      entry. A PD-only count cannot carry it: 0x07CC held it with six sites
#      of which none is EC-side, and the grade read as "the EC implements
#      this, nobody has tried it" -- the claim the image split left with
#      nothing behind it. Re-graded to `unknown-not-absent` 2026-09-27 (#32),
#      matching 0x07D0, 0x07D1, 0x07D6, 0x07D7 and 0x07E2-0x07E5.
#      The four values whose warrant is a *live* observation are exempt, and
#      the exemption is deliberate rather than convenient: 0x07B9 is a byte
#      Windows demonstrably writes with zero direct MOV DPTR sites anywhere
#      in the image, and 0x0748-0x074B is a live-refuted mechanism with no
#      site in either image. Demanding EC-side sites of a live-confirmed byte
#      would re-introduce the error the `absent` note above retracts. The
#      exemption is those four values and nothing else.
#   3. `present-untested` also requires that at least one of an address's
#      EC-side sites RESOLVES to a read, a write or both. Rule 2 asks whether
#      a site exists; this asks what it is worth, which is a different question
#      and gets its own name rather than widening rule 2 into something the
#      reference count does not decide. "Resolves" is ec/tools/
#      register_ref_table.py's `--callee-depth 1` verdict, committed per site
#      in ec/annotations/site-resolution.csv and produced by
#      ec/tools/check_site_resolution.py. A DPTR handoff that the callee's
#      entry point settles is a legitimate warrant: the address demonstrably
#      goes somewhere, and the direction is a plain store or load one call
#      away. A `none` cell -- no `movx` in the decoded window -- is not, and
#      neither is a handoff the callee does not settle. `XDATA_0420` is the
#      one entry the rule refuses, and it is exempt by name: its single
#      EC-side site hands the address across a `ret` in R1:R2, which
#      --callee-depth does not model, so the verdict is a limit of the tool
#      rather than a property of the byte. The exemption names its own
#      expiry -- when 0x0420's direction is established, #1103's R1:R2
#      propagation, it is deleted. Nothing here is measured on hardware: a
#      resolved direction is a static instruction, not evidence the EC acts on
#      the byte, and this rule moves no `status:`.

registers:
  - name: PROJECT_ID
    addr: 0x0740
    sources: [uniwill-laptop, ecspec-3.1.6.0, live]
    static_refs: 1
    static_refs_main_ec: 1
    static_refs_pd_image: 0
    status: confirmed-working
    note: "reads 0x0F = PROJECT_ID_CML_GAMING on this board"

  - name: AP_OEM (ENABLE_MANUAL_CTRL)
    addr: 0x0741
    bit: 0
    sources: [uniwill-laptop, live]
    static_refs: 35
    static_refs_main_ec: 35
    static_refs_pd_image: 0
    status: confirmed-working
    note: >
      Gate for the charge-profile write path (see docs/findings.md).
      EC firmware clears the profile back to High Capacity at 0xB13A
      unless this bit is set. Driver sets it in uniwill_ec_init(),
      clears it in uniwill_shutdown() -- profile must be reapplied
      every boot by design, not as a workaround.
      The vendor calls it "AP exist": MyEcCtrl.Set_APExistToEC(bool) is
      a read-modify-write of bit 0
      (windows/decompiled/v3.1.39.0/GCUService/MyECIO/MyEcCtrl.cs).
      Read live 2026-09-19 as 0x01 with the vendor service running.
      The vendor also clears it while it asks the EC for its default fan
      tables (FanTable_Manager1p5.RefreshDefaultFanTableAll; see
      windows/vendor-ec-map.md "Fan tables"). Held at 0x01 throughout the
      2026-09-23 power-mode capture.
      Bit 7 of the same byte, BIOS side only (docs/findings.md 8): BIOS
      1.09's OemOcDxe reads 0x0741 on every boot (EC commands 0xA3 07,
      0xA2 41, 0xA4). If bit 7 is set, it disables CpuSetup "OverClocking
      Feature", sets UniWillVariable.OverClockRecoveryFlag, and writes the
      byte back with bit 7 cleared (0xA5). So bit 7 reads as an
      "overclock failed, recover" request from the EC. The EC side is now
      traced: one instruction sets it, at bank0 0xCFEE, at the tail of
      collect_two_flags_into_0816_then_raise_ap_oem_bit7 at 0xCFC6. That
      routine scans XDATA 0x0B00-0x0BFC for the marker bytes 0x14 and 0x32,
      latching what it finds in the two-bit accumulator 0x0816, and sets
      bit 7 only when 0x0816 reads exactly 3 -- that is, when both markers
      have been seen at different offsets. This is a reading of the code,
      not a statement that the EC ever ran it or that a recovery occurred:
      what puts those two bytes in the region is not found by any method in
      this tree, so whether the request reflects a real overclock outcome is
      untested and needs the machine. The write-up, with the bank/address
      citations and the searches that did not find a writer, is
      docs/findings/0741-bit7-oc-recovery.md; the status above is for
      bit 0 only.

  - name: CTGP_DB_CTRL / OFFSET
    addr: [0x0743, 0x0744, 0x0745, 0x0746]
    sources: [uniwill-laptop, dsdt(GNEN/ECDC/CTVA/DBCT/MXDB),
              vendor-3.1.39.0(GpuFeatures), live]
    static_refs: [7, 1, 1, 1]
    static_refs_main_ec: [7, 1, 1, 1]
    static_refs_pd_image: [0, 0, 0, 0]
    status: confirmed-working
    note: >
      NVIDIA_CTGP_CONTROL feature bits. All 10 sites are EC-side, so the
      count is not PD contamination (ec/annotations/static-refs-audit.md).
      Bit layout of 0x0743 (GpuFeatures): bit 0 DB function control, bit 1
      DB enable, bit 2 cTGP enable. 0x0744 cTGP offset over BIOS DefaultTGP,
      0x0745 DB total-processing-power target, 0x0746 DB max TGP. The vendor
      writes them per power mode on AC: 0x0743=0x03, 0x0744=0x0A (125-115),
      0x0745=0xFF, 0x0746=5; on battery 0x0743=0 and 0x0745/0x0746=0
      (windows/vendor-ec-map.md "Power modes", issue #92).
      2026-09-23 (issue #8), confirmed live against nvidia-smi on the RTX
      3070 Laptop (evidence/ec-watch/2026-09-23-ctgp-live.txt): with the
      dGPU default_limit 115 W and max 140 W, setting 0x0743 bit 2 (cTGP
      enable) with 0x0744=0x0A raised the *enforced* power limit 120 -> 130 W
      within ~1 s, and clearing it restored 120. So enforced = default 115 +
      DynamicBoost 5 (0x0743 bit 1) + cTGP offset 10 (0x0744, when bit 2
      set). This is exactly uniwill-laptop's ctgp_offset path (write 0x0744,
      enable 0x0743), so that path is validated on this board. Caveat:
      setting 0x0746 (DB max) to 0 did NOT change the static enforced limit,
      so 0x0746's effect is runtime/opportunistic, not a static cap, and is
      not separately confirmed. Upstream's cTGP init writes 25 to 0x0746;
      this BIOS caps DynamicBoost at 15 W and the vendor writes 5.

  - name: BIOS_OEM (FN_LOCK_STATUS)
    addr: 0x074E
    bit: 4
    sources: [uniwill-laptop, live]
    static_refs: 4
    static_refs_main_ec: 4
    static_refs_pd_image: 0
    status: confirmed-working
    note: "Fn+F10 verified physically to toggle F-key behaviour"

  - name: SUPPORT_1
    addr: 0x0765
    sources: [uniwill-laptop]
    static_refs: 0
    static_refs_main_ec: 0
    static_refs_pd_image: 0
    status: absent
    note: >
      driver reads this for capability bits (SUPER_KEY_LOCK, LIGHTBAR,
      FAN_BOOST); not referenced by this firmware build
      No committed line puts the three capability names at 0x0765; the names
      themselves are not missing from the tree, and every line behind them
      lands on some other byte. The committed upstream excerpt
      (linux/patches/gm7mg7p-dmi-entry/upstream-excerpt.txt) carries no
      0x0765 line, its only FAN_BOOST token is TRIGGER_FAN_BOOST BIT(2)
      under EC_ADDR_TRIGGER 0x0767 (upstream-excerpt.txt:160, upstream
      line 213), and SUPER_KEY_LOCK_STATUS and LIGHTBAR_STATUS are 0x0768
      bits (upstream-excerpt.txt:169-170); outside the excerpt the vendor
      stack's own fan boost is a third thing again, the FAN_BOOST_ON and
      FAN_BOOST_OFF cases in
      windows/decompiled/v3.1.39.0/GCUService/MyControlCenter.MyFan/
      MyFanManager_RamFan1p5.cs:270,274 reach a SetFanMode that writes bit 6
      of 0x0751 (windows/vendor-ec-map.md:71), and none of 0x0767, 0x0768,
      0x0751 is 0x0765. The ASL's ECMG field list
      (evidence/acpi/dsdt.dsl:52193-52194, the only field list in the DSDT
      that names XDATA addresses in that window) has no Offset anywhere in
      0x0720-0x072F or in 0x0760-0x076F. The one literal 0x076x in the
      DSDT, CreateBitField (BUF0, 0x0768, D4RW) at :4365, is a bit offset
      into a local Name (BUF0, Buffer (0x021C)) at :4156 rather than an
      XDATA address, so it is evidence about neither range. The excerpt's
      silence is a curated fragment set rather than the whole of
      uniwill-acpi.c, so this is not a claim that upstream does not define
      0x0765; on this board, though, a Linux driver cannot source those
      capabilities from here. A read-only procedure for that is prepared
      and not run:
      docs/hardware-tests/ac-autoboot-0726-0765.md section 5, with 0x0726
      as the other half of the pair
      docs/findings/pd-only-status-vocabulary.md question 1 names.

  - name: SUPPORT_2
    addr: 0x0766
    sources: [uniwill-laptop]
    static_refs: 7
    static_refs_main_ec: 7
    static_refs_pd_image: 0
    status: present-untested
    note: >
      Status rests on the reference count alone, so it was the entry most
      at risk from the file-wide/PD conflation corrected for 0x07E2-0x07E5.
      The audit (ec/annotations/static-refs-audit.md) puts all 7 sites in
      the EC image (bank0=5, bank1=2) and none in the PD image, so the
      count still says what the status claims it says. Still not exercised
      live.

  - name: TRIGGER
    addr: 0x0767
    sources: [uniwill-laptop, live]
    static_refs: 10
    static_refs_main_ec: 10
    static_refs_pd_image: 0
    status: confirmed-working
    note: "TRIGGER_SUPER_KEY_LOCK bit flips SWITCH_STATUS; used for super-key toggle test"

  - name: SWITCH_STATUS (SUPER_KEY_LOCK_STATUS)
    addr: 0x0768
    bit: 0
    sources: [uniwill-laptop, live]
    static_refs: 8
    static_refs_main_ec: 8
    static_refs_pd_image: 0
    status: confirmed-working
    note: "physically confirmed: Super key went dead when bit cleared"

  - name: OEM_9 (AC_AUTO_BOOT_ENABLE)
    addr: 0x0726
    bit: 3
    sources: [uniwill-laptop]
    static_refs: 0
    static_refs_main_ec: 0
    static_refs_pd_image: 0
    status: absent
    note: >
      Write via driver was accepted (EC bit visibly flipped) but firmware
      never reads this address anywhere findable by direct-DPTR scan.
      DOWNGRADED from earlier (wrong) "confirmed-inert" call -- a write
      being accepted is not evidence the EC acts on it, and per the
      0x07B9 retraction, "0 direct refs" is not proof it's ignored either.
      Real verdict: unknown, needs a live behavioural test (does the
      laptop actually auto-boot on AC insert while off?).
      That procedure is prepared and not run:
      docs/hardware-tests/ac-autoboot-0726-0765.md. Its first arm is a
      control with this byte untouched, because whether XDATA survives a
      shutdown with AC out is the run's first observation rather than a
      precondition -- if the power sequence clears the byte, the treated
      arms tested nothing and the run is void rather than negative. A
      negative result moves this row toward the unknown-not-absent
      argument, not toward absent, and does not settle the grade; see
      docs/findings/pd-only-status-vocabulary.md question 1, which is open
      on purpose.

  - name: OEM_4 (CHARGING_PROFILE_MASK)
    addr: 0x07A6
    bits: [0, 1, 2, 3, 4, 5, 6]
    sources: [uniwill-laptop, ecspec-3.1.6.0(BatteryLimitationMode),
              vendor-3.1.39.0(ec-callsites.csv), xdata-refs, live]
    static_refs: 7
    static_refs_main_ec: 7
    static_refs_pd_image: 0
    status: confirmed-working-partially
    note: >
      Writing the 3 profile values (00=High Capacity/01=Balanced/10=Stationary)
      is accepted and the EC selects a different early-exit current limit at
      firmware sites 0xB2E2/0xB330 (ec/annotations/charge-profile-flow.md).
      BUT: coulomb-counted live traces (evidence/battery-traces/2026-09-09-profiles.csv)
      show >1A still flowing at 95% under both Trickle and Long_Life -- the
      profile changes the *taper*, not a hard stop. See docs/findings.md.
      LIVE 2026-09-18, from the Windows side (docs/findings.md 4g,
      evidence/ec-watch/2026-09-18-profile-switch-0700-07ff.csv): cycling
      Control Center 3.1.39.0's three battery modes while sweeping
      0x0700-0x07FF every 0.3s changed exactly one non-sensor byte, this
      one, once per switch -- Stationary 0x29, High capacity 0x09, Balanced
      0x19, i.e. bits 4-5 = 10/00/01 exactly as recorded above, now
      confirmed from the vendor stack and not only from uniwill-laptop.
      The low nibble is a constant 0x09 here, which the Linux traces
      (0x00/0x10/0x20) did not carry; what those bits mean is unknown.
      This is the only address the vendor's battery-protection UI was
      observed to write.
      LIVE 2026-09-19 (docs/findings.md 4i): coulomb-counted charges under
      Stationary (this=0x29) charged smoothly through ~86% at full taper
      current -- from 28% armed-at-plug-in, after mid-charge cycling, and
      after a clean unplug/discharge/replug with the profile untouched. The
      2021 fake-charge (rate->0 at ~86%, gauge to 100%) did not reproduce.
      So no profile value drives a hard stop on this EC image; the profile
      selects a taper, consistent with the static trace at 0xB2E2.
      CORRECTION 2026-09-19 (docs/findings.md 4l,
      ec/annotations/charge-target-derating.md): "selects a taper" is
      wrong. The 0xB2E2/0xB330 branches set a *floor* on a per-cell
      charge-voltage derating (Stationary >= 200 mV/cell, Balanced >= 100,
      High capacity 0). Cycle count and a temperature-weighted
      high-voltage-hours counter can raise the derating above that floor,
      and on this pack they have (250 mV/cell -> CHARGE_TARGET 0x0522 =
      16400 mV). So the profile is a real EC control with no observable
      effect on this pack at its current age. Confirmed live: a switch to
      High capacity during the CV phase at 88% left 0x0522 at 16400 and
      the taper unchanged (evidence/battery-traces/
      2026-09-19-windows-bios-defaults.csv, phase cv88_switch_to_highcap).
      Decrypted vendor source (windows/decompiled/v3.1.39.0/GCUService/
      GCUService.MySystem/BatteryProtection2.cs): the three modes are a
      read-modify-write of bits 4-5 only, and the service resets to High
      capacity (00) whenever it exits. Other vendor methods RMW other bits
      of this byte (touchpad toggle, mic-mute LED, SetApExist, overboost:
      windows/decompiled/v3.1.39.0/ec-callsites.csv). After a BIOS
      load-defaults on 2026-09-19 the byte read 0x28 instead of 0x29, so
      bit 0 cleared; its owner was not established.
      2026-09-27 (issue #93), the full bit map and bit 0's owner. Every
      bit's vendor writer with its file:line is tabulated in
      docs/findings/oem4-bit-map-and-bit0.md, and `bits:` above is widened
      from [4, 5] to [0-6] on that basis. Bit 0 MyFanManager.SetApExist
      (b & 0xFE / b | 1, MyFanManager.cs:1500-1507); bit 1
      SetOverBoostByDynamicTemp, which is an ADD and not an OR --
      (Data & 253) + ((!bEnable) ? 2 : 0) -- so a scan keyed on `| 2`
      misses it; bit 2 MicMuteControl.SetLED (b & 0xFB / b | 4); bit 3
      MySettingManager.UserSetTouchPadLedStatus (b & 0xF7 / b | 8); bits
      4-5 BatteryProtection2.SetHealthProtection*; bit 6
      MySettingManager.TouchpadToggle_ON/OFF (& 0xBF, _OFF re-adding 64).
      Bit 7 has no writer found by either ec_callsites.py over the vendor
      tree or trace_xdata_refs.py over this image -- not found, not unused.
      "Its owner was not established" above is superseded: the EC sets
      bit 0, at 0xABC0 (`movx a,@dptr ; orl a,#0x01 ; movx @dptr,a`,
      ec/decompiled/bank0/AB9E.asm:24-27), inside set_0751_and_07a6_bits,
      already named at ec/annotations/ghidra-functions.csv:152, and only
      when bit 1 of 0x0782 (BIOS_OEM_2, the Q-key) is clear, per
      AB9E.asm:7-9. That is a STATIC claim and a narrow one: the
      instruction sequence is evidence the EC writes the bit, not that it
      acts on it, and what the bit means to the EC is not decoded. The
      fan manager running on this machine cannot write bit 0 --
      MyFanCtrl.cs:26-72 picks one of four MyFanManager_RamFan1p5*
      classes and none contains SetApExist or calls base.Init()/
      base.Uninstall(), and RamFan1p5's replacement Uninstall records the
      same fact in NVRAM instead (MyFanManager_RamFan1p5.cs:248). That
      this machine takes a RamFan1p5* arm at all is a PRIOR RECORDED
      observation, not a result of this work: the service published
      RamFan1p5Support: 1 and IsProjectIdCommercial: 0 here
      (evidence/mqtt-capture/2026-09-18-profile-and-connect.jsonl), the
      two branch conditions MyFanCtrl.cs:30 and :46 test -- written at
