    status: present-untested
    note: >
      The DSDT splits it into APTC (7 bits) + APTN (bit 7). The vendor
      writes offset|0x80 when the user enables the TCC offset, and 0
      otherwise (the default in every mode; it held 0x00 through the
      2026-09-23 capture). Upstream names this address EC_ADDR_FAN_DEFAULT
      (FAN_CURVE_LENGTH 5), and ECSpec 3.1.6.0 ADDR_L1_PWM_DEFAULT_MYFAN3.
      Those don't agree with the DSDT or with 3.1.39.0 here, which agree
      with each other.

  - name: AP_OEM_6 (whisper status / universal fan control)
    addr: 0x07C6
    sources: [uniwill-laptop(EC_ADDR_AP_OEM_6), dsdt(WMS0), vendor-3.1.39.0, live]
    static_refs: 12
    static_refs_main_ec: 12
    static_refs_pd_image: 0
    status: present-untested
    note: >
      Bit 2 (upstream ENABLE_UNIVERSAL_FAN_CTRL): the vendor clears it
      before every fan-table write and sets it afterwards
      (MyFanTableCtrl.SetFanControlByRamFan1p5). Seen live on 2026-09-23 as
      a 1-2 s dip at every mode switch. Bits 0-1 (DSDT WMS0): the vendor
      reads them back as the NVIDIA Whisper Mode setting
      (GpuFeatures.GetWisperModeStatus) and only ever clears them. Yet they
      went 0 -> 3 on every switch into Office and back on the way out. No
      GCUService EC call site sets them, and the DSDT never writes WMS0 by
      name, so the writer is unidentified. Upstream also names bit 3
      BATTERY_CHARGE_FULL_OVER_24H and bit 4 BATTERY_ERM_STATUS_REACHED.
      Live 0x04 at rest.
