      the ITE8850-PD image, which has its own unrelated 0x04A6. Status is
      unchanged -- it is confirmed live, and where the static sites sit
      cannot weaken a live read. What the PD image's 4 sites do is a
      separate, unanswered question about that program.
      Since answered, in ec/annotations/pd-xdata-overlap.md: all 4 use
      0x04A6 as the base of strided address arithmetic and never access the
      byte, so the PD image is not a second writer of the cycle count --
      static evidence only, and the status here is unaffected either way.
      0x04A6 is also the count in this file least made of direct accesses:
      5 of its 7 sites hand DPTR to a subroutine rather than perform a movx
      at the site (ec/annotations/static-refs-audit.md 5.2). All 5 are
      resolved a level deeper elsewhere -- the 4 PD ones by the file above,
      the EC-side one at 0xDFD0 by that file's 2 (a 16-bit store helper) --
      so this is a shape of the count, not a gap in the evidence.
      Also an input to the charge-voltage derating: bank0 0xB167 copies it
      (big-endian) to 0x0A4C, where 150/250/350/450/550 cycles select 50-250
      mV/cell (ec/annotations/charge-target-derating.md). Read 450 live on
      2026-09-19, which puts it in the 200 mV/cell tier by count alone.

  - name: CHARGE_TARGET_MV (charger constant-voltage target)
    addr: [0x0522, 0x0523]
    sources: [live, mech-forza-control(ADDR_BATTERY_CHARGE_TARGET)]
    static_refs: [10, 1]
    static_refs_main_ec: [10, 1]
    static_refs_pd_image: [0, 0]
    status: confirmed-working
    note: >
      Little-endian mV, and HOST-READ-ONLY: this is an EC-owned output, not a
      control surface. A host write does not persist -- across three live runs
      (docs/findings.md 4m, issue #91) every readback returned the EC's value
      16400, including one taken microseconds after the write; 2000 back-to-back
      reads after a write caught the written value 0 times, while a control
      write to the dead byte 0x07B9 held in the same run. The EC reclaims
      0x0522 faster than a ~100 us host round-trip. So do NOT expect a Linux
      charge cap by writing this.
      Written by bank0 0xB378/0xB389 as the pack's requested ChargingVoltage
      (SBS_CHARGING_VOLTAGE, 0x030E) minus a per-cell derating times the cell
      count (ec/annotations/charge-target-derating.md), and recomputed in the
      periodic task loop (slot 0x8539 -> 0xB12C -> 0xB158, plus a second writer
      0xE010 in the same slot). Read live as 0x4010 = 16400 mV on 2026-09-18,
      -19 and -21, against 17400 requested, under Stationary/Balanced/High
      capacity alike. The pack's CV plateau (EC 0x0438) sits at 16466 mV under
      every profile, in every trace in evidence/battery-traces/. Whether the
      charger physically tracks this byte (vs 0x030E) is the open causation
      question -- not reachable by host override, and (issue #98, 2026-09-23)
      not reachable by a host SMBus read either: the DSDT's host SMBus
      controller SBUS (0x001F0004) has no battery/charger child, and
      BAT0._BST reads the pack through EC fields (EC0.XST0-3), so the charger
      sits on the EC's private SMBus. The host's only window is this byte.
      So the charger-follows-0x0522 question stays correlational; live on
      2026-09-23 the pack sat at 16466 mV (0x0438) = this 16400 target, 934
      mV under the 17400 request (0x030E). docs/findings.md 4n.
      mech-forza-control uses the same address and name on a newer Uniwill EC
      (docs/related-projects.md).

