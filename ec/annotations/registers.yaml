    addr: [0x07E2, 0x07E3, 0x07E4, 0x07E5]
    sources: [uniwill-laptop]
    static_refs: [15, 9, 4, 10]
    static_refs_main_ec: [0, 0, 0, 0]
    static_refs_pd_image: [15, 9, 4, 10]
    status: unknown-not-absent
    note: >
      *** CORRECTION, see ec/annotations/lightbar-bat-flow.md ***
      Previously recorded as present-untested on the strength of
      "unlike the AC-side lightbar registers, these ARE referenced by the
      firmware (15/9/4/10)". Those counts are real but file-wide: all 38
      sites are in the ITE8850-PD image at file 0x20000, a separate 8051
      program with its own vector table and its own XDATA -- where the
      four bytes are ordinary variables in a dense compiler-allocated
      block (read/written as 16-bit pairs, compared with subb, packed as
      bit-fields). The main EC image references them zero times.
      That is NOT a demotion to absent: zero direct refs is the same
      signal docs/findings.md 4c retracted for 0x07B9, with the same
      indirect-addressing blind spot. What these bytes drive on this board
      is still undetermined, and no write to them has ever been attempted
      here -- lightbar-bat-flow.md 5 is the live probe that would settle
      it, for a human at the machine.
      Classified by access direction (ec/annotations/static-refs-audit.md
      5.2), 11 of the 38 PD sites resolve no further than "DPTR handed to a
      subroutine" -- for 0x07E3 that is 5 of its 9, a majority of that
      address's population. Nine of those eleven have since been decoded one
      level down (register_ref_table.py --callee-depth 1, per-site rows in
      lightbar-bat-flow.md 3.4-3.5): 3 call a routine that loads from the
      handed address, 6 call one that stores to it, and 2 hand DPTR on a
      second time and stay unresolved. So the PD image's 38 sites are now 20
      reads, 16 writes and 2 unresolved by this method -- instructions in the
      PD image do store to these bytes, in runs that reach past 0x07E5 into
      0x07E6-0x07E8, which is the compiler-allocated-block shape above and
      not four control bytes. None of the 38 is a movc, so none of the count
      is a CODE-pointer artefact. All of that is static decode of the PD
      image only: it says nothing about the EC's own 0x07E2-0x07E5, and a
      decoded store is not evidence anything acts on the value.

