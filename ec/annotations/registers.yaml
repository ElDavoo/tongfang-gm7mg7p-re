      one Offset (0x7D0) with DBD2 starting at bit 8, so they are two
      disjoint byte fields. So "two independent 8-bit fields" is a claim
      about a field list and not about a value any AML object holds as
      one. The CLOBBER HAZARD paragraph above is
      NOT retracted: what the DSDT and the PD firmware differ about is
      the MEANING of these two bytes. What changes is that the collision
      question leaves the DSDT entirely, because a conflict between two
      readings needs a DSDT reading and there is none; what remains is
