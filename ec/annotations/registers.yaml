      Those sets are disjoint, which is the point worth keeping: a dead setter
      in the service is evidence about the setter and not about the byte, and
      here the firmware demonstrably drives a bit of the byte the service never
      reaches. Whether the EC acts on bit 3 the way its name suggests is a
      separate, unexercised question and is left open rather than answered
      here. The Windows side and the per-setter file:line are in
      docs/findings/uncalled-vendor-setters.md; 0x07A6 bit 1, the fifth setter,
      belongs to issue #93 and is not claimed here. 5 direct MOV DPTR,#0x07A5
      sites, all in the main EC, recounted by
