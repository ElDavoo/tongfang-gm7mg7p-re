      *** ADDENDUM (issue #111, 2026-09-30) *** Which routine seeds this block
      is settled, and it is not the fixed-byte arm. The seeding routine is
      bank0/94D0, whose two writers for 0x0730 are 0x9527 `movc A,@A+DPTR`,
