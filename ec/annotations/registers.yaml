      The four EC-firmware sites are walked in
      ec/annotations/ec-07c4-07d5-sites.md. Two of them, 0xDA2D and 0xDA41,
      sit in the routine entered at 0xD9FE and write this byte outright with
      0x30, 0x40, 0x50 or 0x70 -- that is, with GFID = 3, 4, 5 or 7 -- on
      bit 4 of the byte at 0x166A within an arm chosen by bit 2 of the byte
      at 0x1666. Both now have entries in this file, as XDATA_166A and
      XDATA_1666; before issue #267 neither did, and the note here used to
      say so. A third, 0xBA46, is a read-modify-write that clears only the
      low nibble and returns the masked value in A. The fourth, 0x94D5, reads
      the byte, masks the high nibble and XORs 0x30 to test for GFID = 3,
      then branches.
      *** What that 0x94D5 branch does with the answer, scoped tightly
      (issue #267). *** In copy_code_table_into_0730_07a7, GFID == 3 picks a
      seed pair at 0x0A51/0x0A52 of 0x61/0xC8, and every other GFID --
      4, 5 and 7 alike -- picks 0x61/0x92 (ec/decompiled/bank0/94D0.asm,
      0x94D5-0x9518). Within the GFID == 3 arm there is a second condition:
      0x61/0xFE is taken when the first 0xBA36 call returns zero, or when a
      second 0xBA36 returns 3; 0x61/0xC8 needs the first call non-zero and
      the second's return other than 3. So on this path the two-bit select
      behaves as a two-way choice, GFID == 3 against everything else, and
      the three other constants 0x94D0 collapses onto one seed pair. That
      is a statement about 0x94D0 and not about the field: GFID is a
      four-way select as far as SMRW is concerned, as the paragraph above
      sets out. The seed pair is a CODE pointer, not a pair of PL values --
      0x94D0 stores it and then reads bytes out of the table it addresses
      with movc, copying them into 0x0730-0x0733, 0x0735, 0x0737 and
      0x07A7-0x07AA, which do have entries here. What makes GFID 3 special
      to the GPU is not determined by the instruction stream; the open
      question and the procedure that would settle it are in
      docs/hardware-tests/gpu-tgp-07c4-07d7-door.md, which is marked NOT
      RUN.
      *** ADDENDUM (issue #111, 2026-09-30) *** The paragraph above names
      GFID as 0x94D0's discriminator and stops there. Two things follow that
      are worth having in this file rather than only in the write-up. First,
      GFID is a RUN-TIME value and not a build-time constant: 0xD9FE
      seed_07d3_gfid_and_08xx_defaults writes this whole byte as 0x30, 0x40,
      0x50 or 0x70 -- GFID 3, 4, 5 or 7 -- choosing by bit 2 of 0x1666 and bit
      4 of 0x166A, so what the firmware branches on is computed by the EC from
      the 0x16xx board-identification block. That THIS machine's GFID is 3 is a
      live value nobody has read; the procedure is
      docs/hardware-tests/mode-defaults-variant-read.md, marked NOT RUN.
      Second, the choice does not change the values that get written: all three
      seed tables hold the same sixteen bytes over the indices 0x94D0 reads,
      so 0x0730 comes out 0x3C whichever arm ran. The discriminator gates the
      routine; it does not vary the result. That is a fact about the three
      tables, not about the field, and it is why this entry can say the
      discriminator is named without saying which variant is live -- the
      question does not arise for these twelve bytes.
      A decoding caution, recorded because it is the shape of error this
      repository has had to retract twice: the `jnb` at 0x957C is `30 e2 1a`,
      and 0xE2 is the bit address of ACC.2, not the P2 latch (P2.2 is 0xA2).
      The accumulator still holds the 0x0782 byte read at 0x9578, so the
      branch is bit 2 of 0x0782 -- which is what the 0x94D0 row of
      ghidra-functions.csv has always said, and no correction to it was made.
      r2, disasm8051.py and Ghidra's own decompile of the routine
      (`BIOS_OEM_2 >> 2 & 1`) agree. The same reading settles 0xDA26/0xDA30,
      which the XDATA_1666 and XDATA_166A notes above already record as bit 2
      of 0x1666 and bit 4 of 0x166A.
      Bits 0-3 therefore have two EC-side writers that touch only
      that nibble and two that overwrite the whole byte with a value whose
      low nibble is zero, so the two groups do not contradict each other.
      Counts are direct MOV DPTR site counts and are lower bounds for the
      reason the file header gives (#110); a write class is not evidence the
      EC acts on the value. No hardware was involved.

