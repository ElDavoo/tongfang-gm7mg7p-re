      0x95C0. The discriminator is GFID (0x07D3, below), which picks one of
      three seed pairs -- 0x61/0xFE, 0x61/0xC8, 0x61/0x92 -- stored at 0x0A51
      and 0x0A52 and used as a CODE pointer big-endian. All three seed tables
      are BYTE-IDENTICAL over the sixteen bytes the copy reads:
