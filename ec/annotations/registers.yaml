      0x6192. The copy's `+1` at 0x9547 and 0x9570 turns the three `00` bytes
      into `01`, so the movc path yields 3C 3C A5 01 / 23 23 A5 01 /
      4B 4B A5 01 -- which is exactly the live reading above, all three
      four-byte groups. The `0x0782` bit-2 index group is neutral for the same
      reason: indices 0x04-0x07 and 0x08-0x0B hold the same four bytes.
