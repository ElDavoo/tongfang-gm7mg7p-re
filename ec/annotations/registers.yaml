      bank0 0x8B14 and 0x8C46; word comparisons against 0x0CEE at bank1
      0xC3A0 and 0xC392, and against a CODE table entry at bank1 0xB0D1.
      **The producer chain is a static reading of committed listings and
      two committed scans, and no part of it is a behaviour** -- nothing
      was watched move, no byte was read back, and no status here rests on
      a live run; `confirmed-working` would need the `uniwill-laptop,
      live` source BAT_CYCLE_COUNT carries and this work does not produce
      one. The chain, hop by hop and cited to line, is
      docs/findings/pack-temp-producer-chain.md, which also carries the
      suite (ec/tools/test_pack_temp_producer_chain.py) that pins the byte
