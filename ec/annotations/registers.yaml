      windows/decompiled/v3.1.39.0/GCUService/MyControlCenter/WMIEC.cs
      lines 331-343, opens a WMI ManagementObject on AcpiTest_MULong
      (ACPI\PNP0C14\1_1), takes GetMethodParameters("SMRW") and
