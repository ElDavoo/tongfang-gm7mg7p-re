      ec/tools/check_register_counts.py; the count is per byte and does not
      separate bit 5 from the five below it. A name is not a function and a
      count is not behaviour -- what the sites do is register_ref_table.py's
      question, not this file's. No hardware was involved, and
      windows/tools/gpu_block_watch.py's rows are a prepared capture, not a
      capture that has been run.
      The Windows service also has a private setter for bit 4 of this byte,
      SkipOfficeModeSafetyProtect, which clears bit 4 through the mask 0xEF and
      sets it when its argument is 1 (MyFanManager_RamFan1p5.cs:2322-2332).
      It has exactly one reference in the whole v3.1.39.0 tree, its own
      definition, so it is uncalled rather than dormant. The byte's other
      setter is SetEcFanControlRespective on bit 7, which lives in
      FanTable_Manager1p5 (FanTable_Manager1p5.cs:1006) and is called there
      (:270, :289, :417); FanTable_Manager1p5 is a different class, built by
      MyFanTableCtrl (MyFanTableCtrl.cs:25) rather than by MyFanCtrl. The count
      above is per byte and so separates neither bit 5 from bit 4 nor bit 4
      from bit 7 -- docs/findings/uncalled-vendor-setters.md carries the
      per-setter file:line and the grep that reproduces the single hit.
      The per-site split those 10 resolve into is walked in
      ec/annotations/ec-0x07c5-sites.md, with the table in
      ec/annotations/ec-0x07c5-sites.csv: all ten are in the main EC and none in
      the PD image, six read the byte and four read-modify-write it, and none
      writes it outright. A read there is what the per-site window reached, not
      a statement that the site does not write: 0x8410's window stops at a
      branch and the bit-6 clear is three bytes past it, and that file's §3.2
      says so. The four masks clear bit 7, bit 5, bit 5 and bit 7, so
      two of them (0xAD8C and 0xCC6B, anl a,#0xdf) clear the bit position the
      ASL names WHMS, in two separately named init routines. That is a fact
      about the instruction stream and not that the EC acts on WHMS: no site
      here is a live test, and whether that bit position is the identity those
      two masks act on is left open in that file. Two corrections ride with the
      walk. xdata-registers.csv's [writer] tag on
      bank0:0xBB80=store_a_then_read_07c5 does not hold -- that address is one
      movx @DPTR,A against whatever DPTR the caller left and never names this
      byte; the 0x07C5 access in that pair is the read at 0xBB81. The tag is
      generated by ec/tools/xdata_register_map.py, so it is corrected in the
      door procedure's 0x07C5 cell and in the walk rather than by hand-editing
      the generated file. And the 10 here and the service's 10 in
      windows/decompiled/v3.1.39.0/ec-callsites-summary.csv (row
      0x07C5,literal,10,10) are two measurements that agree, not one ten seen
      twice: one counts sites in a firmware image, the other methods in a
      managed assembly, and six of the firmware's ten only read the byte. No
      static_refs count and no status value moved with that walk.

