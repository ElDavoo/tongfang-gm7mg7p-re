      (windows/decompiled/v3.1.39.0/ec-callsites.csv). Read live as
      75/75/165 in Turbo (2026-09-18, the "unexplained 0x4B" of
      docs/findings.md 4g) and 60/60/165 in Gaming (2026-09-19), matching
      ECSpec's ADDR_GAMING_PL1/PL2/PL4_DEFAULT_VALUE at 0x0730-0x0732 (read
      live as 3C 3C A5). Office defaults are at 0x0734-0x0736 (23 23 A5 =
      35/35/165). Not written from the host; untested as a control.
      2026-09-23 (issue #92, windows/vendor-ec-map.md "Power modes"): the
      vendor's SetUserProfile writes the mode's profile values on every
      mode switch and every AC/battery change: Office 35/35/165, Gaming
      60/60/165, Turbo 75/75/165, and 0/0/0 on battery. The capture saw all
      of them land (evidence/ec-watch/2026-09-23-power-mode-cycle-0700-07ff.csv,
      evidence/ec-watch/2026-09-23-power-mode-snapshot-dc.txt). "Not written
