      each of those four comparisons in SMRW picks a different ACPI Buffer
      for the method to address, jointly with a second field, PDIN (4 bits
      at Offset 0x74C, dsdt.dsl:52213). GFID == 0x07 selects ACPB or ACSB
      on PDIN 8/7/5 vs 4/6; GFID == 0x05 selects ACPC or ACSC on the same
      split; GFID == 0x03 selects ACPD or ACSD on PDIN 8/7/5/4/6 vs 0/3;
      GFID == 0x06 selects ACPE, on PDIN 4 only. Those seven are declared:
      ACPB (dsdt.dsl:50383), ACSB (50387), ACPC (50391), ACSC (50396),
      ACPD (50401), ACSD (50406) and ACPE (50411), each a Name (n, Buffer
      (m)) with initial contents, 8 bytes for ACPB, ACSB and ACPE and 12
      for the other four. What SMRW does with one is a copy in each
      direction rather than a register access. Arg0 is cut into RWFG (8
      bits at offset 0), REOF (8 bits at 0x08) and WRBF (0x60 bits, 12
      bytes, at 0x08) at dsdt.dsl:50768-50770; RWFG == 0xAA stores WRBF
      into the selected buffer, and RWFG == 0xBB lays a
      CreateDWordField over it at the index the caller put in REOF and
      returns that DWord in Local0. WRBF is 12 bytes and three of the
      seven buffers are 8, so the write arm stores more than its shortest
      targets hold; how an AML store reconciles the two lengths is not
      something this repository has run, and which bytes land is not
      established here. The
