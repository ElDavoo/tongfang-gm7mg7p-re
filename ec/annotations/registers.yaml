      following it), so its offset is the caller's byte at run time rather
      than a fixed one. So the select picks one of seven ASL buffers, not a
      register bank, and the initial byte patterns are the only thing the
      declarations say about what they hold: 50 50 5F 00 87 0F 57 FF
      (ACPB), 50 50 5F 00 73 0F 57 FF (ACSB), 78 78 A5 05 0A 0F 57 73 23
