  - name: MODE_PL_DEFAULTS (per-mode PL1/PL2/PL4/D-state defaults)
    addr: [0x0730, 0x0731, 0x0732, 0x0733, 0x0734, 0x0735, 0x0736, 0x0737,
           0x07A7, 0x07A8, 0x07A9, 0x07AA]
