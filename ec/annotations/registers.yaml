      measured rather than assumed, and the answer narrows rather than
      widens. DBD1 occurs exactly twice in evidence/acpi/dsdt.dsl -- one
      store at :50687 and one declaration at :52249 -- and both DBD1 and
      DBD2 are written only by the T1WR Arg0 == 0x1173 arm, which is a
      pure writer. Nothing loads the pair, and the reason is not the
      obvious one: DBD1/DBD2 are the only route AML has to these bytes
      THROUGH THE ECMG FIELD LIST (no IndexField or CreateField is
      declared over ECMG), but not the only route full stop. ECRR/ECRW at
      dsdt.dsl:50497/50504 compute 0xFE410000 + Arg0 -- the base ECMG
      itself declares -- and access the byte through the OperationRegion
      MMRW builds, so ECRR IS a reader of 0x07D0 with no field name in the
      path at all. The file has MANY computed-base methods, not three,
      and some that build one ARE called -- DLLR at :19119 builds EMPC
      at an XBAS-relative base (XBAS is External, so unbounded by any
      committed input) and is invoked at :19223 -- so a list of three
      names is not an enumeration and the census is derived from the
      file instead. What holds: no AML in the committed DSDT reaches the
      pair by a computed base that resolves into this window, and ECRR,
      ECRW, SMRW at :50764 are among the methods nothing calls. A region
      whose base is a runtime value is reported as UNBOUNDED, never
      cleared. The same writer arm also mirrors both bytes into
      NPCF.AMAT/NPCF.AMIT, whose owning AML is External and not
      committed here, so nothing here excludes an SSDT reading them back
      as a word.
