  - name: CTL0
    addr: 0x0EA8
    sources: [dsdt(CTL0)]
    static_refs: 3
    static_refs_main_ec: 3
    static_refs_pd_image: 0
    status: present-untested
    note: >
      Head of the CTL0-CTL7 run at 0x0EA8-0x0EAF, from the DSDT ECMG field
      sweep (issue #30; see ec/annotations/dsdt-ecmg-field-sweep.md). Offset
      (0xEA0) declares UVER, RESV, CCI0-CCI3, then CTL0 through CTL7 and the
      MGI/MGO banks (dsdt.dsl:52281-52327), and the CTL run has the most
      direct MOV DPTR sites of anything on the 0x0Exx page -- 3 here and 1 in
      each of CTL1-CTL7.
      *** The shape of those sites, measured rather than inferred: they are a
      straight-line copy, not a table walk. bank0 0xF335-0xF374 is eight
      8-byte stanzas, each `mov DPTR,#src / movx A,@DPTR / mov DPTR,#dst /
      movx @DPTR,A`, copying 0x0EA8-0x0EAF into 0x0F61-0x0F68 one byte at a
      time with no inc dptr anywhere in it. The earlier reading of this note
      took the eight-byte spacing for a walk and said so; it was a guess from
      the spacing and the disassembly does not support it. Re-derive with
      `python3 ec/tools/trace_xdata_refs.py ec/firmware/GMxMGxx_11.800
      0x0EA8` and `make_bank_image.py ec/firmware/GMxMGxx_11.800 0 0x08000`
      plus `r2 -a 8051 -q -c 's 0x0f335; pd 32' bank0.bin`. ***
      The other two sites are separate, and both are inside bank0 0xF221:
      0xF221 reads this byte and compares it with 0x12, and 0xF234 is that
      cjne's own branch target -- mov DPTR,#0x0ea8 / movx A,@DPTR / ret -- so
      the mismatch arm re-reads the byte and returns it to the caller. The
      copy at 0xF335 is the one described above, not one of these two. So this
      byte is a value something chooses, not a table, on this evidence -- and
      "on this evidence" is doing real work in that sentence, since what
      writes 0x0EA8 is still not established. Three is a count of byte
      patterns, not of accesses. The page as a whole is the sweep's open
      question -- 59 DSDT names over 0x0E0D-0x0ECF, of which 50 have no
      direct site by this method at all, which is "not found", not absent
      (docs/findings.md 4c), and is the follow-up this sweep exists to
      produce. No hardware was involved.

