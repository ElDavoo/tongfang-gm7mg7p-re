      writes them all the time. The DSDT can write them too (T1WR 0x81/0x82/0x84).
      What the EC does with a value, including 0, is still untested.
      2026-09-23 (issue #99, ec/annotations/manual-fan-ctrl-0751.md 5): of
      the five sites per address, four are reads and the fifth is the EC's
      own writer, at 0xA833/0xA837/0xA83B in one run. It writes a cleared
      accumulator -- 0 -- and only when AP_OEM (0x0741) bit 0 is clear, i.e.
      when no host agent has announced itself. It does not read 0x0751 or
      the per-mode defaults, which answers issue #99's static half: nothing
      found by that method copies a default into these bytes. When that
      routine runs is not established (its one caller, 0x851B, sits in the
      unresolved three-byte-stub run of bank-call-audit.md), so whether the
