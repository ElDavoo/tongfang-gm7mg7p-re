      stopping before any movx, and 9 hand DPTR to a subroutine. The
      census tags two functions [writer]: the
      pd:0xABBF named build_masked_indexed_table_bytes, which stores R7
      and then builds five masked indexed table bytes from the value read
      back, and pd:0xBECB, which stores R3 here in the same three
      instructions that store R5 into 0x07D6. pd:0x805E writes a zero here
      as part of the same state update that copies a table byte into
      0x07D6. Those are write classes, not evidence the EC acts on the
      byte. No hardware was involved.

