      dsdt.dsl:50780 and 50776. Its SMRW_CMD_OFFSET = 0 and
      SMRW_VALUE_OFFSET = 8 (:23, :25) are the same two offsets the ASL cuts
      Arg0 at; the dumped .cs references neither constant, so that is the
      layout agreeing rather than a call the source makes.
      windows/native/ACPIDriver.sys.analysis.md:328 carries the driver's
      SMAPCTable entry for SMRW, and :400 records that it marshals a
      0x80-byte buffer argument where every other entry in that table takes
      integers -- which is what the method's single Buffer argument is. So
      the consumer is the vendor service through the WMI ACPI driver, not
      something outside the tree. How the provider binds the name SMRW to
      \_SB.INOU.SMRW is the provider's own business and is not decoded here;
      the method set the two name (MMRW, SMRW, IORD, T1RD, ...) is the INOU
      method set. ***
