      change the values written. The fixed arm is gated on 0x0770 == 0x04
      through 0xB8C0, with the polarity running the opposite way to the
      obvious reading (0xB8C0 returns 1 for that value and 0x95BB `jnz` sends
      THAT case into the block), so the arm runs when 0x0770 == 0x04; nothing
      static says what that byte holds, and this addendum does not claim the
      arm did or did not run. Full derivation, with the r2 transcripts:
      docs/findings/mode-defaults-variant-selector.md. The live read that
      would settle the gate is
      docs/hardware-tests/mode-defaults-variant-read.md, and it has not been
      run. Nothing here changes the status above: a derived value agreeing with
      a recorded one is consistency, not a measurement.

