      (design mV), 0x031A = 2000 (full-charge mAh). The field meanings are
      read from their values against the SBS layout, not from code. Read by
      the charge-target routine at bank0 0xB292/0xB297.

  - name: CPU_PL1 / PL2 / PL4 (APL1/APL2/APL4)
    addr: [0x0783, 0x0784, 0x0785]
    sources: [dsdt, ecspec-3.1.6.0(ADDR_PL1/PL2/PL4_SETTING_VALUE),
