      bit 3, and that bit is one the Windows service's setters do not touch:
      bank0:0x8749=mode_tick_084c_07a5_09ee clears it (anl a,#0xf7) when
      XDATA_0440 is zero or read_06e6_xor_01() is non-zero, and in the other
      arm clears it below the CPU/GPU temperature thresholds and sets it
      (orl a,#0x08) above them (ec/decompiled/bank0/8749.c:91-106). A writer
      reaching the byte through a computed DPTR is outside that count; see the
      find_indirect_xdata.py caveat in this file's header.
