      status unknown-not-absent rather than absent for the reason
      docs/findings.md 4c retracted: #110 owns the computed-DPTR blind
      spot, where 0x07B9 is writable and working with no direct reference
      anywhere. The one computed-DPH construction this file rules out for
      the page is narrow and is stated as such in
      ec/annotations/ec-07d6-07d7-sites.md section 5: addc a,#0x07 ; mov
      DPH,a (34 07 F5 83) does not occur in the EC image, where the same
      four-byte shape with 20 other immediates does and the 0x0F control
      reproduces eight known sites. The register form, mov DPH,a from a
      register, and an indirect movx @Ri are all invisible to that grep.
      0 is a lower bound, never a total. WALKED 2026-09-24 (issue #282):
      recorded rather than resolved, and the name is the address on
      purpose -- there is no field name to carry and inventing one would
      be a claim the DSDT does not support, the same spelling
      XDATA_0436_PAIR uses for the deliberately-unnamed 0x0436/0x0437 pair.
      Nothing here is a live test and no hardware was involved.

