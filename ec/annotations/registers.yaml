      (SBS_CHARGING_VOLTAGE, 0x030E) minus a per-cell derating times the cell
      count (ec/annotations/charge-target-derating.md), and recomputed in the
      periodic task loop (slot 0x8539 -> 0xB12C -> 0xB158, plus a second writer
      0xE010 in the same slot). Read live as 0x4010 = 16400 mV on 2026-09-18,
      -19 and -21, against 17400 requested, under Stationary/Balanced/High
      capacity alike. The pack's CV plateau (EC 0x0438) sits at 16466 mV under
      every profile, in every trace in evidence/battery-traces/. Whether the
      charger physically tracks this byte (vs 0x030E) is the open causation
      question -- not reachable by host override, and (issue #98, 2026-09-23)
      not reachable by a host SMBus read either: the DSDT's host SMBus
      controller SBUS (0x001F0004) has no battery/charger child, and
      BAT0._BST reads the pack through EC fields (EC0.XST0-3), so the charger
      sits on the EC's private SMBus. The host's only window is this byte.
      So the charger-follows-0x0522 question stays correlational; live on
      2026-09-23 the pack sat at 16466 mV (0x0438) = this 16400 target, 934
      mV under the 17400 request (0x030E). docs/findings.md 4n.
      mech-forza-control uses the same address and name on a newer Uniwill EC
      (docs/related-projects.md).

  - name: SBS_CHARGING_VOLTAGE (pack-requested charge voltage)
    addr: [0x030E, 0x030F]
    sources: [live, mech-forza-control(ADDR_BATTERY_BASE_VOLTAGE)]
    static_refs: [4, 1]
    static_refs_main_ec: [4, 1]
    static_refs_pd_image: [0, 0]
    status: present-untested
    note: >
      Little-endian mV. Read live 2026-09-19 as 0x43F8 = 17400 (4 x 4.35
      V/cell, a high-voltage 4S pack). It sits in a smart-battery data block
      at 0x0300: "BMS-GF" (manufacturer), then 0x0310 = 3800 (probably the
      requested ChargingCurrent, mA), 0x0312 = 4100 (design mAh), 0x0314 =
