      two of which compute `value x 10 + 0x0AAA` and one `value x 10 +
      0x0A46`, so the word is at minimum overwritten by scaled arithmetic
      on four paths. Whether the pair tracks the pack, and what the 0x04FF
      bit 3 / 0x0505 gate selects, need the physical machine; that is the
      issue's own hardware question and nothing here answers it.
      **The PD half is a collision of address numbers, not shared bytes.**
      All five PD `0x04A3` sites hand DPTR to a helper that RETURNS, adding
      a stride term; three of the five then dereference the returned pointer
