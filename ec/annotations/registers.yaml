# EC register cross-reference for TongFang GM7MG7P / GM5MG7Y, ITE EC-V14.6
# (file ec/firmware/GMxMGxx_11.800), PROJECT_ID_CML_GAMING (0x0F).
#
# Sources, tagged per-register below:
#   uniwill-laptop : linux/drivers/platform/x86/uniwill/uniwill-acpi.c address/bit defines
#   ecspec-3.1.6.0 : Define.ECSpec constants from the unobfuscated Windows service
#                    (windows/decompiled/v3.1.6.0/ECSpec.cs)
#   static-scan    : ec/tools/scan_refs.py reference count against the EC image
#                    (CAVEAT: that count is file-wide, and the 256 KiB dump holds
#                    TWO 8051 programs -- the EC firmware at file 0x00000-0x17FFF
#                    and a separate ITE8850-PD USB-PD image at 0x20000-0x2FFFF,
#                    with its own vectors and its own XDATA map. Refs in the PD
#                    image are not refs to an EC register. ec/tools/trace_xdata_refs.py
#                    splits a count per image. See
#                    ec/annotations/lightbar-bat-flow.md. "Its own XDATA map"
#                    was an assumption until 0x04A6, the one address with
#                    sites in both images, was decoded both ways in
#                    ec/annotations/pd-xdata-overlap.md; it held there, on
#                    static evidence, which is not the same as proven.)
#   xdata-refs      : ec/tools/trace_xdata_refs.py -- the per-site form of the
#                    same scan: which image each site is in, its runtime
#                    address, and whether it reads, writes, or hands DPTR to a
#                    subroutine. Site table and the page it covers:
#                    ec/annotations/xdata-0400-045f.md. It is still a static
#                    scan and is NOT `live`: a zero is "not found by this
#                    method", never "absent", and a read-modify-write is
#                    evidence the EC touches a byte, not that it acts on it.
#
# reference-count keys (all three are direct MOV DPTR,#addr site counts,
# and all three inherit the blind spot in the "absent" note below):
#   static_refs          : file-wide total over all 256 KiB, as scan_refs.py
#                          reports it. Kept verbatim; it is the number older
#                          notes in this repo quote.
#   static_refs_main_ec  : sites in the EC firmware itself (file 0x00000-0x17FFF:
#                          common area + CODE banks 0 and 1).
#   static_refs_pd_image : sites in the ITE8850-PD image (file 0x20000-0x2FFFF),
#                          which are references to a different program's XDATA.
# Every entry carries the split; an entry without it has not been audited.
# The recorded numbers are reproducible from the committed image, and
# ec/tools/check_register_counts.py recomputes them and fails on a mismatch.
# The per-address audit, with the command that produced it, is in
# ec/annotations/static-refs-audit.md. None of the three is a count of
# *register accesses*: a site can build a CODE pointer or hand DPTR to a
# subroutine instead. What each site does is classified per address in
# 5 of that file, from ec/tools/register_ref_table.py.
#   live           : read back on real hardware via regmap debugfs / /dev/mem
#   dsdt           : mentioned in evidence/acpi/dsdt.dsl ECMG field list
#
# status values:
#   confirmed-working   : live behaviour matches the driver's model
#   confirmed-inert      : write accepted, EC does not act on it (proven live)
#   present-untested     : static-scan finds real references, not yet exercised live
#   absent                : static-scan finds zero direct references
#                            (NOTE: absence is not proof -- see docs/findings.md,
#                            "Static-scan validation" and "Retraction". 0x07B0-0x07BE
#                            is a known blind spot: Windows writes 0x07B9 and it works,
#                            but no direct MOV DPTR reference exists anywhere in image.)
#   unknown-not-absent   : the references that made it look present turned out to
#                            belong to the PD image, so the EC image has none -- and
#                            per the note above that is not "absent" either

registers:
  - name: PROJECT_ID
    addr: 0x0740
    sources: [uniwill-laptop, ecspec-3.1.6.0, live]
    static_refs: 1
    static_refs_main_ec: 1
    static_refs_pd_image: 0
    status: confirmed-working
    note: "reads 0x0F = PROJECT_ID_CML_GAMING on this board"

  - name: AP_OEM (ENABLE_MANUAL_CTRL)
    addr: 0x0741
    bit: 0
    sources: [uniwill-laptop, live]
    static_refs: 35
    static_refs_main_ec: 35
    static_refs_pd_image: 0
    status: confirmed-working
    note: >
      Gate for the charge-profile write path (see docs/findings.md).
      EC firmware clears the profile back to High Capacity at 0xB13A
      unless this bit is set. Driver sets it in uniwill_ec_init(),
      clears it in uniwill_shutdown() -- profile must be reapplied
      every boot by design, not as a workaround.
      The vendor calls it "AP exist": MyEcCtrl.Set_APExistToEC(bool) is
      a read-modify-write of bit 0
      (windows/decompiled/v3.1.39.0/GCUService/MyECIO/MyEcCtrl.cs).
      Read live 2026-09-19 as 0x01 with the vendor service running.
      The vendor also clears it while it asks the EC for its default fan
      tables (FanTable_Manager1p5.RefreshDefaultFanTableAll; see
      windows/vendor-ec-map.md "Fan tables"). Held at 0x01 throughout the
      2026-09-23 power-mode capture.
      Bit 7 of the same byte, BIOS side only (docs/findings.md 8): BIOS
      1.09's OemOcDxe reads 0x0741 on every boot (EC commands 0xA3 07,
      0xA2 41, 0xA4). If bit 7 is set, it disables CpuSetup "OverClocking
      Feature", sets UniWillVariable.OverClockRecoveryFlag, and writes the
      byte back with bit 7 cleared (0xA5). So bit 7 reads as an
      "overclock failed, recover" request from the EC. Which EC code sets it,
      and when, is not traced; the status above is for bit 0 only.

  - name: CTGP_DB_CTRL / OFFSET
    addr: [0x0743, 0x0744, 0x0745, 0x0746]
    sources: [uniwill-laptop, dsdt(GNEN/ECDC/CTVA/DBCT/MXDB),
              vendor-3.1.39.0(GpuFeatures), live]
    static_refs: [7, 1, 1, 1]
    static_refs_main_ec: [7, 1, 1, 1]
    static_refs_pd_image: [0, 0, 0, 0]
    status: confirmed-working
    note: >
      NVIDIA_CTGP_CONTROL feature bits. All 10 sites are EC-side, so the
      count is not PD contamination (ec/annotations/static-refs-audit.md).
      Bit layout of 0x0743 (GpuFeatures): bit 0 DB function control, bit 1
      DB enable, bit 2 cTGP enable. 0x0744 cTGP offset over BIOS DefaultTGP,
      0x0745 DB total-processing-power target, 0x0746 DB max TGP. The vendor
      writes them per power mode on AC: 0x0743=0x03, 0x0744=0x0A (125-115),
      0x0745=0xFF, 0x0746=5; on battery 0x0743=0 and 0x0745/0x0746=0
      (windows/vendor-ec-map.md "Power modes", issue #92).
      2026-09-23 (issue #8), confirmed live against nvidia-smi on the RTX
      3070 Laptop (evidence/ec-watch/2026-09-23-ctgp-live.txt): with the
      dGPU default_limit 115 W and max 140 W, setting 0x0743 bit 2 (cTGP
      enable) with 0x0744=0x0A raised the *enforced* power limit 120 -> 130 W
      within ~1 s, and clearing it restored 120. So enforced = default 115 +
      DynamicBoost 5 (0x0743 bit 1) + cTGP offset 10 (0x0744, when bit 2
      set). This is exactly uniwill-laptop's ctgp_offset path (write 0x0744,
      enable 0x0743), so that path is validated on this board. Caveat:
      setting 0x0746 (DB max) to 0 did NOT change the static enforced limit,
      so 0x0746's effect is runtime/opportunistic, not a static cap, and is
      not separately confirmed. Upstream's cTGP init writes 25 to 0x0746;
      this BIOS caps DynamicBoost at 15 W and the vendor writes 5.

  - name: BIOS_OEM (FN_LOCK_STATUS)
    addr: 0x074E
    bit: 4
    sources: [uniwill-laptop, live]
    static_refs: 4
    static_refs_main_ec: 4
    static_refs_pd_image: 0
    status: confirmed-working
    note: "Fn+F10 verified physically to toggle F-key behaviour"

  - name: SUPPORT_1
    addr: 0x0765
    sources: [uniwill-laptop]
    static_refs: 0
    static_refs_main_ec: 0
    static_refs_pd_image: 0
    status: absent
    note: "driver reads this for capability bits (SUPER_KEY_LOCK, LIGHTBAR, FAN_BOOST); not referenced by this firmware build"

  - name: SUPPORT_2
    addr: 0x0766
    sources: [uniwill-laptop]
    static_refs: 7
    static_refs_main_ec: 7
    static_refs_pd_image: 0
    status: present-untested
    note: >
      Status rests on the reference count alone, so it was the entry most
      at risk from the file-wide/PD conflation corrected for 0x07E2-0x07E5.
      The audit (ec/annotations/static-refs-audit.md) puts all 7 sites in
      the EC image (bank0=5, bank1=2) and none in the PD image, so the
      count still says what the status claims it says. Still not exercised
      live.

  - name: TRIGGER
    addr: 0x0767
    sources: [uniwill-laptop, live]
    static_refs: 10
    static_refs_main_ec: 10
    static_refs_pd_image: 0
    status: confirmed-working
    note: "TRIGGER_SUPER_KEY_LOCK bit flips SWITCH_STATUS; used for super-key toggle test"

  - name: SWITCH_STATUS (SUPER_KEY_LOCK_STATUS)
    addr: 0x0768
    bit: 0
    sources: [uniwill-laptop, live]
    static_refs: 8
    static_refs_main_ec: 8
    static_refs_pd_image: 0
    status: confirmed-working
    note: "physically confirmed: Super key went dead when bit cleared"

  - name: OEM_9 (AC_AUTO_BOOT_ENABLE)
    addr: 0x0726
    bit: 3
    sources: [uniwill-laptop]
    static_refs: 0
    static_refs_main_ec: 0
    static_refs_pd_image: 0
    status: absent
    note: >
      Write via driver was accepted (EC bit visibly flipped) but firmware
      never reads this address anywhere findable by direct-DPTR scan.
      DOWNGRADED from earlier (wrong) "confirmed-inert" call -- a write
      being accepted is not evidence the EC acts on it, and per the
      0x07B9 retraction, "0 direct refs" is not proof it's ignored either.
      Real verdict: unknown, needs a live behavioural test (does the
      laptop actually auto-boot on AC insert while off?).

  - name: OEM_4 (CHARGING_PROFILE_MASK)
    addr: 0x07A6
    bits: [4, 5]
    sources: [uniwill-laptop, ecspec-3.1.6.0(BatteryLimitationMode), live]
    static_refs: 7
    static_refs_main_ec: 7
    static_refs_pd_image: 0
    status: confirmed-working-partially
    note: >
      Writing the 3 profile values (00=High Capacity/01=Balanced/10=Stationary)
      is accepted and the EC selects a different early-exit current limit at
      firmware sites 0xB2E2/0xB330 (ec/annotations/charge-profile-flow.md).
      BUT: coulomb-counted live traces (evidence/battery-traces/2026-09-09-profiles.csv)
      show >1A still flowing at 95% under both Trickle and Long_Life -- the
      profile changes the *taper*, not a hard stop. See docs/findings.md.
      LIVE 2026-09-18, from the Windows side (docs/findings.md 4g,
      evidence/ec-watch/2026-09-18-profile-switch-0700-07ff.csv): cycling
      Control Center 3.1.39.0's three battery modes while sweeping
      0x0700-0x07FF every 0.3s changed exactly one non-sensor byte, this
      one, once per switch -- Stationary 0x29, High capacity 0x09, Balanced
      0x19, i.e. bits 4-5 = 10/00/01 exactly as recorded above, now
      confirmed from the vendor stack and not only from uniwill-laptop.
      The low nibble is a constant 0x09 here, which the Linux traces
      (0x00/0x10/0x20) did not carry; what those bits mean is unknown.
      This is the only address the vendor's battery-protection UI was
      observed to write.
      LIVE 2026-09-19 (docs/findings.md 4i): coulomb-counted charges under
      Stationary (this=0x29) charged smoothly through ~86% at full taper
      current -- from 28% armed-at-plug-in, after mid-charge cycling, and
      after a clean unplug/discharge/replug with the profile untouched. The
      2021 fake-charge (rate->0 at ~86%, gauge to 100%) did not reproduce.
      So no profile value drives a hard stop on this EC image; the profile
      selects a taper, consistent with the static trace at 0xB2E2.
      CORRECTION 2026-09-19 (docs/findings.md 4l,
      ec/annotations/charge-target-derating.md): "selects a taper" is
      wrong. The 0xB2E2/0xB330 branches set a *floor* on a per-cell
      charge-voltage derating (Stationary >= 200 mV/cell, Balanced >= 100,
      High capacity 0). Cycle count and a temperature-weighted
      high-voltage-hours counter can raise the derating above that floor,
      and on this pack they have (250 mV/cell -> CHARGE_TARGET 0x0522 =
      16400 mV). So the profile is a real EC control with no observable
      effect on this pack at its current age. Confirmed live: a switch to
      High capacity during the CV phase at 88% left 0x0522 at 16400 and
      the taper unchanged (evidence/battery-traces/
      2026-09-19-windows-bios-defaults.csv, phase cv88_switch_to_highcap).
      Decrypted vendor source (windows/decompiled/v3.1.39.0/GCUService/
      GCUService.MySystem/BatteryProtection2.cs): the three modes are a
      read-modify-write of bits 4-5 only, and the service resets to High
      capacity (00) whenever it exits. Other vendor methods RMW other bits
      of this byte (touchpad toggle, mic-mute LED, SetApExist, overboost:
      windows/decompiled/v3.1.39.0/ec-callsites.csv). After a BIOS
      load-defaults on 2026-09-19 the byte read 0x28 instead of 0x29, so
      bit 0 cleared; its owner was not established.

  - name: CHARGE_CTRL (numeric threshold)
    addr: 0x07B9
    bits: "0-6 value, bit 7 REACHED"
    sources: [uniwill-laptop, ecspec-3.1.6.0(BATTERY_CHARGE_LIMIT_UP), dsdt,
              acpidriver-3.9.18.0(ECRR/ECRW), live]
    static_refs: 0
    static_refs_main_ec: 0
    static_refs_pd_image: 0
    status: unknown-not-absent
    note: >
      *** RETRACTION, see docs/findings.md "Two retractions" ***
      Earlier analysis called this "definitively gone" from 4 angles:
      zero static-scan refs, DSDT ECMG field list steps over the byte,
      driver's own force=1 masks it, and TUXEDO upstream saying it's
      "Intel Project only". All four are now known to be insufficient:
      the Windows service (ECSpec.ADDR_BATTERY_CHARGE_LIMIT_UP = 1977 =
      0x07B9) writes to exactly this address as part of BatteryProtection2,
      and Windows genuinely caps charging (screenshot evidence + vendor UI
      text). Zero direct MOV DPTR refs in the whole image proves only that
      this scan technique cannot see how it's accessed (indirect/pointer
      addressing, or an access pattern the scan doesn't recognise) -- not
      that the EC ignores it. Driver-side write (force_charge_limit=1,
      threshold=80) did NOT stop charging in the one live test we ran
      (evidence/battery-traces/2026-09-09-threshold80.csv) -- but that test
      never wrote the paired DOWN register (see next entry), which Windows
      always sets together with UP.
      The Windows write path is now traced end to end (docs/findings.md 4e,
      windows/native/ACPIDriver.sys.analysis.md): ACPIDriverDll!WriteEC ->
      IOCTL 0x9C40A48C -> ACPI method ECRW -> byte write at physical
      0xFE410000 + 0x07B9. Status is unchanged -- that is a decoded path,
      not an observed effect, and the DSDT ECMG gap it re-grades was never
      what made this entry uncertain.
      LIVE 2026-09-17 (docs/findings.md 4f, evidence/battery-traces/
      2026-09-17-limit-pair.csv): written via the physical window
      (ec/tools/ecmem.py) as 60, 60 with bit 7, and 95 armed from 93%,
      each together with 0x07D0; read back through window and regmap;
      charging continued at full taper current in every case; likewise
      60/55 armed at 56% under each 0x07A6 profile and held untouched
      from 72% through 91%. Status
      stays unknown-not-absent: the byte is writable and stable, and the
      values the vendor writes are still unknown.
      LIVE 2026-09-18 (docs/findings.md 4g): watched from Windows, with the
      vendor service running and a battery mode active, across an AC
      plug-in and three profile switches -- 32499 byte changes recorded
      over 0x0000-0x07FF -- this address never changed and read 0x00
      throughout. So the vendor stack was not observed to use it at all;
      the battery-protection UI writes only 0x07A6. That is scoped to those
      events over ~15 minutes, not to "never written": a threshold
      crossing, service restart or cold boot was not in the window.
      2026-09-19, from decrypted source (docs/findings.md 4k): in Control
      Center Service 3.1.39.0, BatteryProtection2.SetBatteryChargingLimit_Up
      (0x07B9 = (old & 0x80) | limit) is private and has no caller, so the
      scoping above can be dropped for this version: the service never
      writes this byte. The only other writer in the service is
      MyFanManager_QC.SetBatteryChargingLimit, and that class is never
      instantiated in this build: MyFanCtrl picks MyFanManager or a
      MyFanManager_RamFan1p5* variant. On newer Uniwill ECs (MECHREVO Wujie 14XA,
      docs/related-projects.md) this byte only takes effect once a gate at
      0x0742 bit 2 is opened through a stored limit at 0x087F. This image
      has no direct reference to 0x087F, and its only 0x0742 write sets
      bit 1, so that mechanism was not found here.

  - name: DBD1 (DSDT name; ECSpec calls the same byte BATTERY_CHARGE_LIMIT_DOWN)
    addr: 0x07D0
    bits: "0-7 value; T1WR stores Arg1 * 8 into it"
    sources: [ecspec-3.1.6.0(BATTERY_CHARGE_LIMIT_DOWN), dsdt,
              acpidriver-3.9.18.0(ECRR/ECRW), live]
    static_refs: 254
    static_refs_main_ec: 0
    static_refs_pd_image: 254
    status: unknown-not-absent-DO-NOT-WRITE-BLIND
    note: >
      Windows always sets an UP/DOWN pair (Battery_Commands.CHARGING_UP_LIMIT
      + CHARGING_DOWN_LIMIT) via BatteryProtection2. uniwill-laptop has no
      concept of a "resume charging below" threshold and has never written
      this address. 254 direct references is the busiest address in the
      whole 0x0780-0x07FF range -- too busy to be a single-purpose "resume
      threshold" byte on this firmware. Needs disassembly of all 254 sites
      before writing to it (see issue: "map 0x07D0 call sites").
      *** CORRECTION to the "too busy" argument, see
      ec/annotations/lightbar-bat-flow.md 6: the 254 count is right but
      all 254 sites are in the ITE8850-PD image, not the EC firmware,
      which references 0x07D0 zero times by this method. Status is
      unchanged -- a byte Windows writes with no traceable EC-side handler
      is less understood, not more -- but "too busy for a threshold" is an
      observation about the PD firmware's variables, and mapping the sites
      is a PD-image question. ***
      All 254 sites are now enumerated in ec/annotations/ec-0x07d0-sites.md
      (site table: ec-0x07d0-sites.csv): 254 distinct sites, not one
      function called repeatedly; 229 read, 15 write, 2 increment in place,
      and the value is multiplied against structure strides (0x5E/0x60/0x77)
      to index arrays -- an index/state variable of the PD firmware, which
      says nothing about the EC's own 0x07D0. Status moves from
      present-untested to unknown-not-absent for the same reason the
      LIGHTBAR_BAT_* entry did: "present" rested on references that are not
      in the EC image. DO-NOT-WRITE-BLIND stands; the paired UP/DOWN write
      in docs/findings.md 5 is still the experiment that would settle it,
      and is still a human step.
      Reachable by the same ECRW path as the UP register (docs/findings.md
      4e): physical 0xFE4107D0. Unlike 0x07B9 this offset IS named in the
      DSDT ECMG field list, as DBD1 (with DBD2 at 0x07D1) -- what DBD1 is
      for is not established, and reading the vendor's name as "the resume
      threshold" would be a guess.
      WRITTEN LIVE 2026-09-17 (docs/findings.md 4f): 55 and 90, paired
      with 0x07B9, via the physical window; accepted, stable, no effect
      on charging within the sampled windows. DO-NOT-WRITE-BLIND is
      relaxed to this extent only: byte values 0x00/0x37/0x5A caused no
      visible misbehaviour over ~15 minutes. Second writer found: DSDT
      T1WR (dsdt.dsl:50676, Arg0 == 0x1173) stores Arg1*8 into DBD1
      (0x07D0) and Arg2*8 into DBD2 (0x07D1), mirrored to
      \_SB.NPCF.AMAT/AMIT -- a GPU power value in 1/8 W, not a battery
      threshold. Whether the EC firmware, the vendor service, or neither
      reads it as a charge limit is not established.
      RE-GRADED 2026-09-23 (docs/findings.md 4o, issue #131), which is
      where the entry's name changed. The question 4f left open -- which
      program, if any, treats this as a charge threshold -- is answered
      for the committed inputs, and the answer is none of them. The only
      committed writer of 0x07D0 in any committed input is the DSDT:
      T1WR's Arg0 == 0x1173 branch (dsdt.dsl:50680-50691). Every other
      T1WR branch, and the T1WR Arg0 == 0x73 branch and its _Q84 twin
      (dsdt.dsl:52793-52805), work on a different byte of the same
      0x07C4-0x07D7 block (CPUA 0x07D4, DBAP 0x07D5) for the same GPU
      purpose, which is what makes that block a GPU dynamic-boost control
      block rather than battery state.
      On the Windows side, windows/tools/t1wr_callers.py censuses every
      committed input for TempWrite1, T1WR, the 0x9C40A4DC IOCTL and the
      0x1173 Arg0: not found by this method, in the fully decrypted
      3.1.39.0 tree, in both partial trees, in every committed vendor
      binary's string table (ASCII and UTF-16LE), in the UWP front end's
      .msixbundle and in its .appxsym PDB name table. Two of those are
      closed rather than open -- GCUService 3.1.39.0's only
      ACPIDriverDll.dll P/Invoke is SMAPCTable (AcpiCtrl.cs:127), and the
      front end reaches the service over MQTT. The unreadable inputs are
      named in that section, not glossed: the 3.1.6.0/3.9.18.0 encrypted
      bodies, the two Inno installer payloads, and any firmware component.
      ADDR_BATTERY_CHARGE_LIMIT_DOWN is a vendor constant with exactly one
      committed writer, BatteryProtection2.SetBatteryChargingLimit_Down
      (windows/decompiled/v3.1.39.0/GCUService/GCUService.MySystem/
      BatteryProtection2.cs:347), which is private and has no caller in
      this build. So for the service on this machine the vendor name has
      no writer behind it.
      Status is unchanged. That is a decoded path, not an observed effect,
      and a constant with no caller is not a name proved stale: the EC
      image could still act on the byte for either reason, which is #34
      and #25, not this entry. What the re-grade changes is the reading
      order -- "resume charging below X%" is now the less supported of the
      two, and "a GPU power byte the BIOS writes" is the only committed
      writer's own account of itself.
      CLOBBER HAZARD, recorded and not fixed: the vendor charge-limit
      write (ECRW, docs/findings.md 4e) and the GPU TGP write (T1WR 0x1173)
      land on the same physical byte and disagree about scale -- ECRW
      writes it raw, so a 55% limit lands as 0x37, while T1WR 0x1173
      stores Arg1 * 8, so its largest possible value lands as 0xF8. Two
      writers, one byte, two meanings, and nothing in the committed inputs
      says which a given value carries. That is arithmetic on two decoded
      paths, not an observed failure -- no hardware was involved in
      establishing it, and the live writes in docs/findings.md 4f are still
      the only hands-on test of this byte -- so DO-NOT-WRITE-BLIND stands.

  - name: DBD2 (DSDT name; no vendor constant, no committed Windows writer)
    addr: 0x07D1
    bits: "0-7 value; T1WR stores Arg2 * 8 into it"
    sources: [dsdt]
    static_refs: 76
    static_refs_main_ec: 0
    static_refs_pd_image: 76
    status: unknown-not-absent-DO-NOT-WRITE-BLIND
    note: >
      The second half of the 0x07D0/0x07D1 pair: T1WR's Arg0 == 0x1173
      branch stores Arg2 * 8 into DBD2 and mirrors it to
      \_SB.NPCF.AMIT (dsdt.dsl:50688, 50690). DBD1/DBD2 are the DSDT ECMG
      field-list names (dsdt.dsl:52248-52250), and this byte has exactly
      one writer in the whole DSDT -- the same GPU branch that writes
      0x07D0, with the same block evidence behind it (docs/findings.md 4o).
      Arg2 is bounded by 31: the destination is 8 bits and the store is
      Arg2 * 8. That is arithmetic on the ASL, not a claim about what the
      argument means.
      Unlike 0x07D0 it has no ECSpec constant -- it is absent from
      windows/decompiled/v3.1.6.0/ECSpec.cs -- and the service's
      ec-callsites.csv has no row for it, so no committed Windows input
      writes this byte at all. 76 direct MOV DPTR sites, all of them in the
      ITE8850-PD image, none in the EC firmware, by the same method and
      through the same image split that ec-0x07d0-sites.md worked through
      for 0x07D0. Status is unknown-not-absent rather than present-untested
      for the reason the LIGHTBAR_BAT_* entries are: "present" would have
      rested on references that are not in the EC image. The
      DO-NOT-WRITE-BLIND suffix matches 0x07D0 because a blind write here
